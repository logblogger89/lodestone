<style>
/* Layout: app shell — left rail on wide screens, bottom tab bar on iPad/phone; content column max 1100px. */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --surface-2:#e9edef; --line:#d5dce0;
  --fg:#16202a; --muted:#5b6873; --accent:#24507a; --accent-fg:#ffffff; --accent-soft:#dbe6f0;
  --good:#1f7a4d; --good-soft:#dcefe4; --warn:#9a6200; --warn-soft:#f5e8cf; --unk:#6b6f78; --unk-soft:#e6e7ea; --bad:#a3342c; --bad-soft:#f4dedc;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#16202a; --surface-2:#1d2935; --line:#2b3a47;
  --fg:#e6ecf0; --muted:#9aa8b3; --accent:#7fb0e0; --accent-fg:#0b1620; --accent-soft:#1d3247;
  --good:#6fcf9b; --good-soft:#173528; --warn:#e6b45c; --warn-soft:#3a2d12; --unk:#a7acb5; --unk-soft:#262b33; --bad:#ec8a80; --bad-soft:#3b1d1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#16202a; --surface-2:#1d2935; --line:#2b3a47;
  --fg:#e6ecf0; --muted:#9aa8b3; --accent:#7fb0e0; --accent-fg:#0b1620; --accent-soft:#1d3247;
  --good:#6fcf9b; --good-soft:#173528; --warn:#e6b45c; --warn-soft:#3a2d12; --unk:#a7acb5; --unk-soft:#262b33; --bad:#ec8a80; --bad-soft:#3b1d1a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin:0 6px 14px}
.brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;color:var(--muted);min-height:44px}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.nav .count{margin-left:auto;font-family:var(--font-mono);font-size:12px}
.main{min-width:0;padding-block:18px 96px;padding-inline:24px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-family:var(--font-display);font-size:26px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.topbar .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.ghost{background:none}
.sample{font-size:12px;color:var(--warn);background:var(--warn-soft);padding:4px 10px;border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--fg);border:1px solid transparent;white-space:nowrap}
.chip.filter{cursor:pointer;border-color:var(--line);background:var(--surface)}
.chip.s-stated{background:var(--good-soft);color:var(--good)}
.chip.s-inferred{background:var(--warn-soft);color:var(--warn)}
.chip.s-unknown{background:var(--unk-soft);color:var(--unk)}
.chip.s-none{background:var(--bad-soft);color:var(--bad)}
.chip.transfer{background:var(--accent);color:var(--accent-fg);font-weight:600}
.summary{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;color:var(--muted)}
.summary strong{color:var(--fg);font-family:var(--font-display);font-size:18px}
.list{display:flex;flex-direction:column;gap:10px}
.section-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 2px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:start;cursor:pointer}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.done{opacity:.55}
.card h3{margin:0;font-size:16px;font-weight:600;line-height:1.3}
.meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px;margin:2px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.pay{font-family:var(--font-mono);font-size:13px;display:inline-flex;gap:6px;align-items:center}
.est{font-family:var(--font-body);font-size:10px;font-weight:600;letter-spacing:.04em;padding:1px 5px;border-radius:4px;border:1px dashed var(--warn);color:var(--warn)}
.srcs{display:inline-flex;gap:4px}
a.src{text-decoration:none}a.src:hover{border-color:var(--accent)}
.drawer a,.tip a{color:var(--accent)}
details.panel summary{cursor:pointer}
details.panel p{margin:8px 0 0;font-size:14px}
.src{width:22px;height:22px;border-radius:5px;display:inline-grid;place-items:center;font-size:10px;font-weight:700;font-family:var(--font-mono);background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.triage{display:flex;flex-direction:column;gap:6px}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:96px;min-height:36px;cursor:pointer;font-size:13px}
.tbtn.on-i{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.tbtn.on-l{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:600}
.tbtn.on-n{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.ring{position:relative;width:60px;height:60px}
.ring svg{width:60px;height:60px;display:block}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-mono);font-weight:500;font-size:16px}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.reasons button{font-size:12px;border:1px dashed var(--line);background:none;border-radius:999px;padding:4px 10px;cursor:pointer}
.reasons button[aria-pressed="true"]{border-style:solid;border-color:var(--bad);color:var(--bad)}
/* detail drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:21;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.drawer h2{font-family:var(--font-display);font-size:22px;margin:0;text-wrap:balance}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h4{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{display:grid;grid-template-columns:90px 1fr 42px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent)}
.bar .why{grid-column:2 / 4;color:var(--muted);font-size:12px;margin-top:-6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:500;color:var(--muted);font-size:12px}
.tblwrap{overflow-x:auto}
.note{font-size:12px;color:var(--muted)}
/* pipeline */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.col h4{margin:0 2px 2px;font-size:13px;display:flex;justify-content:space-between}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.pcard select{font-size:12px;padding:4px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.flag{font-size:11px;font-weight:600;color:var(--bad)}
/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500}
textarea,input[type=text],input[type=number]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;width:100%}
textarea{min-height:110px;resize:vertical;font-family:var(--font-mono);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch input{width:20px;height:20px}
.slider{display:grid;grid-template-columns:80px 1fr 48px;gap:10px;align-items:center}
.tip{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14px}
kbd{font-family:var(--font-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30}
/* bottom tabs for iPad/phone */
.tabbar{display:none}
@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .main{padding-inline:16px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:15}
  .tabbar button{border:0;background:none;min-height:48px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
  .tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}
}
@media (max-width: 560px){
  .card{grid-template-columns:52px 1fr;gap:10px}
  .ring,.ring svg{width:50px;height:50px}
  .ring .val{font-size:14px}
  .triage{grid-column:1 / -1;flex-direction:row}
  .tbtn{flex:1;min-width:0}
  .topbar h1{font-size:22px}
}
@media (prefers-reduced-motion: no-preference){.fill{transition:width .3s ease}.card{transition:border-color .15s}}
</style>

      <div class="switch"><label for="excl">Exclude roles that manage people</label><input id="excl" type="checkbox" ${P.excludePeople?"checked":""}></div>
      <div class="switch"><label for="nopay">Include roles without posted pay (shown with an estimate)</label><input id="nopay" type="checkbox" ${P.noPay?"checked":""}></div>
      ${["Core","Domain","Stretch"].map(t=>`<div class="switch"><label for="t-${t}">${TIERLABEL[t]}s</label><input id="t-${t}" data-tier="${t}" type="checkbox" ${P.tiers[t]?"checked":""}></div>`).join("")}
    </section>
    <section class="panel"><h4>Digest and pay</h4>
      <div class="field"><label for="dsize">Digest size (1–100)</label><input id="dsize" type="number" min="1" max="100" value="${P.digest}"></div>
      <div class="field"><label for="paymin">Minimum pay, CAD (posted pay only; estimates are never excluded)</label><input id="paymin" type="number" step="5000" value="${P.payMin}"></div>
      <div class="field"><label>Locations</label><div class="chips"><span class="chip">Greater Toronto Area</span><span class="chip">Waterloo Region</span><span class="chip">Remote — Canada</span><button class="chip filter" data-toast="Expanding geography adds more roles">+ Add location</button></div></div>
    </section></div>`;
  if(state.stab==="profile") body=`<section class="panel"><h4>From your CV · editable</h4><div class="grid2">
    <div class="field"><label for="p1">Current employer</label><input id="p1" type="text" value="Google"></div>
    <div class="field"><label for="p2">Level</label><input id="p2" type="text" value="L5 (operating near L6)"></div>
    <div class="field"><label for="p3">Domains</label><input id="p3" type="text" value="Enterprise AI & agents, data governance, trust & safety, FS policy, commerce"></div>
    <div class="field"><label for="p4">Scope signals</label><input id="p4" type="text" value="Led ~80 people across 20 teams; $5B revenue protected; multi-PA strategy"></div></div>
    <p class="note" style="margin:0">Your CV stays on this computer. LinkedIn data export is optional.</p></section>`;
  if(state.stab==="adv") body=`<section class="panel"><h4>Score weights · total <span class="mono">${tot}%</span></h4>${SUBS.map(k=>`<div class="slider"><label for="w-${k}">${SUBLABEL[k]}</label><input id="w-${k}" data-w="${k}" type="range" min="0" max="50" value="${W[k]}"><span class="mono">${Math.round(W[k]/tot*100)}%</span></div>`).join("")}
    <p class="note" style="margin:0">Weights are normalized to 100%. The digest re-ranks instantly.</p><div><button class="btn" id="resetw">Reset to defaults</button></div></section>`;
  return `<div class="topbar"><h1>Settings</h1><span class="sample">Prototype</span></div>
  <div class="tabs">${tabs.map(([k,l])=>`<button data-stab="${k}" aria-pressed="${state.stab===k}">${l}</button>`).join("")}</div>${body}`;
}
function render(){
  const v=state.view;
  document.querySelectorAll("[data-view].nav, .tabbar [data-view]").forEach(b=>b.setAttribute("aria-current", b.dataset.view===v?"page":"false"));
  const el=document.getElementById("view");
  el.innerHTML = v==="digest"?viewDigest(): v==="pipeline"?viewPipeline(): v==="add"?viewAdd(state.prefill): v==="companies"?viewCompanies(): viewSettings();
  state.prefill=null;
  document.getElementById("nc-digest").textContent = visible().filter(j=>j.isNew).length;
  document.getElementById("nc-pipe").textContent = Object.keys(state.stage).length+1;
  const ov=document.getElementById("overlay"); ov.innerHTML = state.open? viewDetail(JOBS.find(j=>j.id===state.open)) : "";
}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-goto-profile]")){e.preventDefault();state.open=null;state.view="settings";state.stab="profile";save();render();return}
  if(e.target.closest("a[href]")) return;
  const t=e.target.closest("[data-view],[data-tri],[data-open],[data-close],[data-reason],[data-ctab],[data-stab],[data-toast],[data-confirm],#parse,#resetw");
  if(!t) return;
  if(t.matches("[data-tri]")){e.stopPropagation();const [id,k]=t.dataset.tri.split("|");triage(+id,k);return}
  if(t.matches("[data-reason]")){e.stopPropagation();const [id,r]=t.dataset.reason.split("|");const tr=state.triage[id];if(!tr)return;const i=tr.reasons.indexOf(r);i<0?tr.reasons.push(r):tr.reasons.splice(i,1);save();render();return}
  if(t.matches("[data-close]")){state.open=null;render();return}
  if(t.matches("[data-open]")){state.open=+t.dataset.open;state.sel=state.open;if(state.view!=="digest"){state.view="digest"}render();return}
  if(t.matches("[data-view]")){setView(t.dataset.view);return}
  if(t.matches("[data-ctab]")){state.ctab=t.dataset.ctab;render();return}
  if(t.matches("[data-stab]")){state.stab=t.dataset.stab;render();return}
  if(t.id==="parse"){document.getElementById("addResult").innerHTML=addResult(document.getElementById("paste").value);return}
  if(t.matches("[data-confirm]")){document.getElementById("addResult").innerHTML=confirmCard();return}
  if(t.id==="resetw"){state.w={...DEFAULT_W};save();render();return}
  if(t.matches("[data-toast]")){toast(t.dataset.toast);return}
});
document.addEventListener("change",e=>{
  const t=e.target,P=state.prefs;
  if(t.id==="sort"){state.sort=t.value;render();return}
  if(t.dataset.stage){state.stage[t.dataset.stage]=t.value;save();render();toast("Moved to "+t.value);return}
  if(t.id==="excl"){P.excludePeople=t.checked}
  else if(t.id==="nopay"){P.noPay=t.checked}
  else if(t.dataset.tier){P.tiers[t.dataset.tier]=t.checked}
  else if(t.id==="dsize"){P.digest=Math.max(1,Math.min(100,+t.value||20))}
  else if(t.id==="paymin"){P.payMin=Math.max(0,+t.value||0)}
  else if(t.dataset.w){save();toast("Weights saved · digest re-ranked");return}
  else return;
  save();render();toast("Preferences saved");
});
document.addEventListener("input",e=>{const t=e.target;if(!t.dataset.w)return;state.w[t.dataset.w]=+t.value;const tot=SUBS.reduce((a,k)=>a+state.w[k],0)||1;
  document.querySelectorAll("[data-w]").forEach(r=>{r.nextElementSibling.textContent=Math.round(state.w[r.dataset.w]/tot*100)+"%"});
  const h=document.querySelector(".panel h4 .mono");if(h)h.textContent=tot+"%";});
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea,select")) return;
  if(e.key==="Escape"&&state.open){state.open=null;render();return}
  if(state.view!=="digest") return;
  const ids=[...document.querySelectorAll(".card")].map(c=>+c.dataset.open); if(!ids.length) return;
  let i=ids.indexOf(state.sel);
  if(e.key==="j"){state.sel=ids[Math.min(ids.length-1,i+1)];render()}
  else if(e.key==="k"){state.sel=ids[Math.max(0,i-1)];render()}
  else if(e.key==="Enter"&&state.sel){state.open=state.sel;render()}
  else if(["i","l","n"].includes(e.key)&&state.sel){triage(state.sel,e.key)}
});
document.addEventListener("paste",e=>{
  if(e.target.matches("input,textarea")) return;
  const txt=(e.clipboardData||window.clipboardData)?.getData("text")||"";
  if(txt.trim()){state.view="add";state.prefill=txt;state.open=null;render();toast("Pasted into Add a job")}
});
render();
</script>
