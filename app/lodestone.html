<title>Lodestone</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Left rail on wide screens, bottom tab bar on iPad/phone; content column max 1100px.
   Tokens follow the M2 prototype ("magnetite and survey map"). */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --surface-2:#e9edef; --line:#d5dce0;
  --fg:#16202a; --muted:#5b6873; --accent:#24507a; --accent-fg:#ffffff; --accent-soft:#dbe6f0;
  --good:#1a6b43; --good-soft:#dcefe4; --warn:#845400; --warn-soft:#f5e8cf; --unk:#565a62; --unk-soft:#e6e7ea; --bad:#a3342c; --bad-soft:#f4dedc;
  --scrim:rgba(10,16,22,.45);
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#16202a; --surface-2:#1d2935; --line:#2b3a47;
  --fg:#e6ecf0; --muted:#9aa8b3; --accent:#7fb0e0; --accent-fg:#0b1620; --accent-soft:#1d3247;
  --good:#6fcf9b; --good-soft:#173528; --warn:#e6b45c; --warn-soft:#3a2d12; --unk:#a7acb5; --unk-soft:#262b33; --bad:#ec8a80; --bad-soft:#3b1d1a;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#16202a; --surface-2:#1d2935; --line:#2b3a47;
  --fg:#e6ecf0; --muted:#9aa8b3; --accent:#7fb0e0; --accent-fg:#0b1620; --accent-soft:#1d3247;
  --good:#6fcf9b; --good-soft:#173528; --warn:#e6b45c; --warn-soft:#3a2d12; --unk:#a7acb5; --unk-soft:#262b33; --bad:#ec8a80; --bad-soft:#3b1d1a;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
b,strong{font-weight:700}
small{font-size:12px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin:0 6px 14px}
.brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;color:var(--muted);min-height:44px}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.nav .count{margin-left:auto;font-family:var(--font-mono);font-size:12px}
.subnav{display:flex;flex-direction:column;gap:2px;margin:2px 0 4px 12px;padding-left:10px;border-left:1px solid var(--line)}
.subnav[hidden]{display:none}
.subnav button{border:0;background:none;text-align:left;cursor:pointer;color:var(--muted);font-size:13px;padding:6px 10px;border-radius:6px;min-height:32px}
.subnav button:hover,.jumpbar button:hover{color:var(--fg)}
.subnav button[aria-current="true"]{color:var(--accent);font-weight:600;background:var(--accent-soft)}
.jumpbar{display:none}
.pfsec{scroll-margin-top:16px}
.pfsec .lead{margin-top:-4px}
.savebar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.savebar.dirty{position:sticky;bottom:12px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.main{min-width:0;padding-block:18px 96px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar h1{font-family:var(--font-display);font-size:26px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.topbar .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.btn:disabled{opacity:.5;cursor:default}
.fresh{font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:32px}
.fresh .dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.fresh.stale .dot{background:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip .cnt{font-family:var(--font-mono);font-size:11px;opacity:.7;margin-left:2px}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--fg);border:1px solid transparent;white-space:nowrap}
.chip.t-core{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.t-adjacent{background:var(--good-soft);color:var(--good)}
.chip.t-stretch{background:var(--unk-soft);color:var(--unk)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.new{background:var(--accent-soft);color:var(--accent);font-weight:600}
.cardfoot{margin-top:6px;gap:6px 10px}
.chip.bad{background:var(--bad-soft);color:var(--bad);font-weight:600}
.toggle{cursor:pointer;border-color:var(--line);background:var(--surface);min-height:30px}
.toggle[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input[type=search]{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;min-height:40px}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;min-height:40px}
.summary{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:baseline;color:var(--muted);font-size:15px}
.summary strong{color:var(--fg);font-family:var(--font-display);font-size:18px}
.list{display:flex;flex-direction:column;gap:10px}
.section-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 2px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:start;cursor:pointer}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#dtitle:focus{outline:none}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.done{background:var(--bg)}
.card.done h3,.card.done .meta,.card.done .fitsum,.card.done .checks,.card.done .compass{opacity:.55}
.card.done .fitsum.donenote{opacity:1;color:var(--fg)}
.card h3{margin:0;font-size:16px;font-weight:600;line-height:1.3}
.co{color:var(--fg);font-weight:600}
.meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px;margin:2px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.pay{font-family:var(--font-mono);font-size:13px;font-weight:400}
.pay small{font-family:var(--font-body);font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}
.pay.us{font-weight:400;color:var(--muted)}
.paymore{font-size:12px;color:var(--muted)}
.paymore+.paymore::before{content:"·";margin:0 6px}
a.src:hover{color:var(--accent);text-decoration:underline}
.nopay{font-size:12px;color:var(--muted)}
.payrows{display:flex;flex-direction:column;gap:2px}
.payrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:8px 10px;border-radius:8px;font-size:13px}
.payrow .lbl{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.payrow .amt{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.payrow.main{background:var(--accent-soft)}
.payrow.main .lbl{color:var(--fg);font-weight:600}
.payrow.main .amt{font-size:16px;font-weight:600;color:var(--fg)}
.payhead{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 10px 0}
details.quotes summary{cursor:pointer;font-size:12px;color:var(--muted)}
.est-pay{color:var(--muted);font-weight:400}
.payrow.est-row{border:1px dashed var(--warn);border-radius:8px}
.payrow.mkt-row{border:1px solid var(--line);border-radius:8px}
.rbanner{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;background:var(--surface);padding:12px 14px;margin:0 0 14px;cursor:pointer;color:var(--fg)}
.rbanner small{display:block;color:var(--muted);margin-top:4px}
.sbanner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;border:1px solid var(--line);border-left:3px solid var(--good);border-radius:10px;background:var(--surface);padding:12px 14px;margin:0 0 14px}
.sbanner>div{flex:1 1 260px;min-width:0}
.sbanner .note{display:block;margin-top:2px}
.learn{font-size:12px;color:var(--muted);margin:6px 0 0}
.learn b{color:var(--good)}
.learn.down b{color:var(--bad)}
.todayhead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:4px 0 2px}
.progress{flex:1 1 160px;max-width:260px;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.progress>span{display:block;height:100%;background:var(--accent)}
.ob{max-width:640px;margin:8px 0 24px}
.ob h1.obpromise{font-family:var(--font-display);font-size:26px;line-height:1.25;margin:4px 0 12px}
.ob h2{font-size:22px;margin:8px 0 4px}
.obkicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.obwhy{color:var(--muted);margin:0 0 16px}
.obprivacy{font-size:13px;color:var(--muted);border-left:3px solid var(--good);padding:4px 0 4px 10px;margin:14px 0 18px}
.obprog{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.obprog .dots{display:flex;gap:4px}
.obprog .dots i{width:28px;height:4px;border-radius:2px;background:var(--line)}
.obprog .dots i.on{background:var(--accent)}
.obnav{display:flex;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.obopts,.obfams{display:grid;gap:8px}
.obfams{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.obopt{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--fg);font:inherit}
.obopt span{font-size:13px;color:var(--muted)}
.obopt[aria-checked="true"],.obopt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.obexplain{font-size:13px;background:var(--accent-soft);border-radius:8px;padding:10px 12px;margin:12px 0 0}
.obexplain p{margin:0 0 6px}.obexplain p:last-child{margin:0}
.taste{display:grid;gap:8px}
.tcard{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px}
.tcard.picked{background:var(--bg)}
.tmeta{display:flex;flex-direction:column;gap:2px;flex:1 1 260px;min-width:0}
.tmeta span{font-size:13px;color:var(--muted)}
.tbtns{display:flex;gap:6px}
.ask{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--accent-soft);font-size:13px}
.ask>span{flex:1 0 100%;font-weight:600}
.meter h4{margin-bottom:8px}
.msteps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0 0 6px}
.msteps span{font-size:12px;color:var(--muted);padding-top:8px;border-top:4px solid var(--line)}
.msteps span.on{color:var(--fg);border-top-color:var(--accent)}
.xpways{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:8px 0}
.xpway{display:flex;flex-direction:column;gap:6px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}
.xpway span{font-size:13px;color:var(--muted)}
.xpway .btn{font-size:15px;font-weight:400;min-height:36px;padding:6px 14px;display:inline-flex;align-items:center}
.xpdel{border:0;background:none;padding:0;font:inherit;font-size:13px;color:var(--muted);text-decoration:underline;cursor:pointer}
.xpbuild{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;background:var(--bg)}
h4.understood{margin:16px 0 2px}
.sbanner.nudge{border-left-color:var(--accent)}
.obbanner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;background:var(--surface);padding:12px 14px;margin:0 0 14px}
.obbanner>div{flex:1 1 280px;min-width:0}
.obbanner span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.donebanner{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-left:3px solid var(--good);border-radius:10px;background:var(--surface);padding:12px 14px;margin:0 0 12px}
.donebanner span{font-size:13px;color:var(--muted)}
.morerow{justify-content:center;margin:14px 0 4px}
.explore-note{font-size:12px;color:var(--muted);margin:-4px 2px 0}
.whyrank{font-size:13px;margin:0 0 12px;padding:10px 12px;border-radius:8px;background:var(--accent-soft)}
.nextstep{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;margin:4px 0 10px}
.nextstep button.link,.likerow button.link{border:0;background:none;padding:0;font:inherit;color:var(--accent);font-weight:600;cursor:pointer}
.likerow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:2px 0 10px;font-size:13px}
.learned li{margin:4px 0}
.report h3{margin:18px 0 6px;font-size:15px}
.report ul{margin:0;padding-left:18px}
.report li{margin:3px 0}
.report .stats{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:13px;margin:6px 0 4px}
.report .stats strong{color:var(--fg);font-family:var(--font-mono)}
.report .actions{border:1px solid var(--warn);border-radius:8px;padding:8px 12px;margin-top:12px}
.archive details{border-top:1px solid var(--line);padding:10px 0}
.archive summary{cursor:pointer}
.card.sug{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;cursor:default}
.panel button.link{border:0;background:none;padding:0;cursor:pointer;color:var(--accent);font-weight:600}
button.plink{border:0;background:none;padding:0;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.ck{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 10px 2px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.ck b{font-size:11px}
.ck-good{background:var(--good-soft);color:var(--good)}
.dtabs{display:flex;flex-shrink:0;gap:4px;border-bottom:1px solid var(--line);margin:0;position:sticky;top:-18px;background:var(--bg);overflow-x:auto;z-index:2;padding-top:6px}
.dtabs button{flex-shrink:0;white-space:nowrap;border:0;background:none;padding:10px 12px;min-height:44px;font-weight:400;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.dtabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.drawer>*{flex-shrink:0}
@media (max-width:520px){.drawer .actrow .btn.primary{flex-basis:100%;text-align:center}.dtabs button{padding:10px 8px;font-size:15px}}
.panel.jd p{margin:0 0 10px;line-height:1.55}
.panel.jd h4{margin:16px 0 6px;text-transform:none;letter-spacing:0;font-size:15px;color:var(--fg)}
.panel.jd ul{margin:0 0 10px;padding-left:20px}.panel.jd li{margin:4px 0;line-height:1.5}
.panel.jd mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 2px}
.ck.info{background:var(--surface);color:var(--fg);border-color:var(--line)}
.ck.tier{background:var(--surface-2);color:var(--fg);border-color:var(--line);font-weight:600}
.ck.tier.t-core{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.flabel{font-size:12px;color:var(--muted);align-self:center}
.famset{border:0;padding:0;margin:0;min-width:0}
.famset legend{font-size:13px;font-weight:600;padding:0;margin-bottom:6px}
.famset .chip{white-space:normal}
.famset .chip .note{font-size:12px}
.legend{margin:2px 0 12px;font-size:13px;color:var(--muted)}
.legend summary{cursor:pointer;width:max-content}
.legend p,.legend ul{margin:8px 0 0}
.legend li{margin:4px 0}
.ck-warn{background:var(--warn-soft);color:var(--warn)}
.ck-bad{background:var(--bad-soft);color:var(--bad);font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.card.sug ul{margin:0;padding-left:18px}
.archive h2{font-family:var(--font-display);font-size:18px;margin:24px 0 4px}
.report button.link{border:0;background:none;padding:0;text-align:left;cursor:pointer;font-weight:600;color:var(--accent)}
.kind{font-family:var(--font-body);font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:1px 5px;margin-left:6px}
.payrow .sub{display:block;font-size:11px;color:var(--muted);font-weight:400}
.payrow.eq{border-top:1px dashed var(--line);border-radius:0;margin-top:4px}
.src-line{font-size:12px;color:var(--muted);margin:4px 0 0}
mark{background:var(--accent-soft);color:var(--fg);border-radius:3px;padding:0 2px}
mark.w{background:var(--warn-soft)}
details.quotes blockquote{margin:6px 0 0;padding:6px 10px;border-left:2px solid var(--line);font-size:12px;color:var(--muted)}
.srcs{display:inline-flex;gap:4px;flex-wrap:wrap}
a.src{font-size:13px;font-weight:400;text-decoration:none;color:var(--muted);padding:0;white-space:nowrap}
a.src:hover{border-color:var(--accent);color:var(--accent)}
.compass{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.1;color:var(--muted);position:relative}
.compass b{display:block;font-family:var(--font-display);font-size:15px;color:var(--fg)}
.compass.core{border-color:var(--accent)} .compass.core b{color:var(--accent)}
.compass.adjacent{border-color:var(--good)} .compass.adjacent b{color:var(--good)}
.ring{position:relative;width:56px;height:56px}
.ring .cap{position:absolute;left:0;right:0;top:33px;text-align:center;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ring svg{width:56px;height:56px;display:block}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:16px;color:var(--fg);padding-bottom:10px}
.ring .trk{stroke:var(--surface-2)} .ring .arc{stroke:var(--accent)} .ring .ndl{fill:var(--accent)}
.stale{color:var(--warn);font-weight:600}
.chip.s-stated{background:var(--good-soft);color:var(--good)}
.chip.s-inferred{background:var(--warn-soft);color:var(--warn)}
.chip.s-unknown{background:var(--unk-soft);color:var(--unk)}
.chip.s-none{background:var(--bad-soft);color:var(--bad)}
.fitsum{font-size:13px;color:var(--muted);margin:-4px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{display:grid;grid-template-columns:76px minmax(0,1fr) 34px;gap:4px 10px;align-items:center;font-size:13px}

/* Freshness (computed here, so it changes daily without re-scoring): older postings are more likely filled.
   Uses the posting date; when a site gives none, the day Lodestone first saw the role, capped lower because
   the role may be older than that. */
function freshness(j){

const DAY=864e5;

  if(v==null||v==="") return null;
  if(typeof v==="number") return v>1e12?v:v*1000;

  if(ms==null) return "";

/* ---------- formatting ---------- */
function fmtK(n){n=+n;if(!isFinite(n)) return "";if(n<1000) return n%1?n.toFixed(2):String(n);return Math.round(n/1000)+"K"}
/* One range as posted (never converted, B8): CA$126K–176K, US$137.9K–256.1K, $45–55/hr. */
function rangeText(r){

function payInfo(j){

const KIND_TAG={base_bonus:"incl. bonus",ote:"OTE",total:"total comp"};
function equityText(e){
  if(!e||!e.offered) return "";
  const a=(e.amounts||[])[0];
  if(a){const v=a.unit==="percent"?`${a.min}–${a.max}%`:a.unit==="shares"?`${fmtK(a.min)}–${fmtK(a.max)} options/shares`:rangeText({...a,interval:"year"});return v}

/* Card: the Canadian range, its place, a tag when it isn't base pay, and quiet notes for other regions and equity. */
function payCard(j){

/* Type scores (D-077): j.aff = how much of the job is each kind of work, 0-100 (j.aff_src "read" = Claude read the

/* ---------- Today (P1-S6): a short list you can finish, frozen for the day so it doesn't shift as you work ---------- */
/* A Lodestone day runs midnight to midnight, local time (Ayush, 10-16). */
const dayKey=ms=>{const d=new Date(ms);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};

function stackPick(n,taken,explore){

  const pool=Object.values(S.jobs).filter(j=>prefOk(j)&&inPreferred(j)&&isTodo(j)&&!taken.has(j.id)).sort((a,b)=>mine(a)-mine(b)||rankScore(b)-rankScore(a));
  const top=pool.slice(0,Math.ceil(pool.length/2)), recent=j=>Date.now()-(parseWhen(j.first_seen)||0)<2*DAY;
  const fresh=top.filter(recent), fs=new Set(fresh.map(j=>j.id));

/* ---------- one-tap suggestions (P1-S6): patterns in your choices become a proposed Profile change you accept or skip ---------- */
const kfmt=x=>"CA$"+Math.round(x/1000)+"k";
function suggestionsList(){

  const nots=Object.entries(S.triage).filter(([,t])=>t&&t.status==="not"), said=r=>nots.filter(([,t])=>(t.reasons||[]).includes(r));
  const pay=said("Pay too low").length;
  if(pay>=3) out.push({id:"pay-"+Math.floor(pay/3),text:`Raise your pay target to ${kfmt(ck.pay_green+10000)}`,why:`You said "Pay too low" on ${pay} roles.`,
    patch:{checks:{...ck,pay_green:ck.pay_green+10000,pay_yellow:ck.pay_yellow+10000}}});
  const lvl=said("Level too junior").length;
  if(lvl>=3&&ck.level_yellow<ck.level_green) out.push({id:"level-"+Math.floor(lvl/3),text:`Count only L${ck.level_green}+ roles as a level match`,why:`You said "Level too junior" on ${lvl} roles, so L${ck.level_yellow} roles will show red instead of yellow.`,
    patch:{checks:{...ck,level_yellow:ck.level_yellow+1}}});
  const pm=said("People management").length;
  if(pm>=3&&!P.exclude_people_mgmt) out.push({id:"people",text:"Hide roles that manage people",why:`You said "People management" on ${pm} roles.`,patch:{exclude_people_mgmt:true}});
  const byCo={};said("Company").forEach(([id,t])=>{const c=(S.jobs[id]||{}).company||t.company;if(c)byCo[c]=(byCo[c]||0)+1});
  Object.entries(byCo).filter(([c,n])=>n>=2&&!(P.hidden_companies||[]).includes(c)).forEach(([c,n])=>out.push({id:"co-"+coKey(c),text:`Hide roles at ${c}`,why:`You said "Company" on ${n} of its roles.`,
    patch:{hidden_companies:[...(P.hidden_companies||[]),c]}}));
  const regs=P.regions||[], byR={};
  Object.entries(S.triage).forEach(([id,t])=>{const j=S.jobs[id];if(t&&t.status==="interested"&&j&&j.region&&j.region!=="Other Canada"&&!regs.includes(j.region))byR[j.region]=(byR[j.region]||0)+1});
  Object.entries(byR).filter(([,n])=>n>=2).forEach(([r,n])=>out.push({id:"region-"+r,text:`Add ${REGION_SHORT[r]||r} to your preferred locations`,why:`You marked ${n} roles there Interested.`,
    patch:{regions:[...regs,r],checks:{...ck,green_regions:[...regs,r]}}}));
  const dw=String(((S.profile||{}).preferences||{}).domains_wanted||"");
  if(/brick|traditional/i.test(dw)&&/financ|bank|insur/i.test(dw)&&!(P.avoid_types||[]).includes("traditional_fi"))   // your own note, applied now instead of after re-scoring

function triage(j,status){

/* ---------- views ---------- */
function freshChip(){
  const j=S.freshness.jobs; const ms=parseWhen(j&&j.at);
  const stale=!ms||(Date.now()-ms)>7*DAY;
  return `<button class="fresh${stale?" stale":""}" data-act="fresh" aria-label="When data was last updated"><span class="dot" aria-hidden="true"></span>${ms?"Jobs updated "+ago(ms):"Not refreshed yet"}</button>`;

/* Overall fit: the six sub-scores blended with the weights from your Profile (computed here, so changing weights re-ranks instantly). */
function fitScore(j){
  if(!j.fit||!j.fit.subs) return null;
  const W=S.prefs.weights||DEFAULT_PREFS.weights; let t=0,sum=0;
  SUBS.forEach(k=>{const w=wv(W,k);t+=w;sum+=w*subVal(j,k)});
  return t?Math.round(sum/t):null;
}
/* Sub-score for one factor: freshness and pathway come from data the app holds (daily date math; ESDC and
   posting evidence), the rest from Claude's scoring. */
/* The viewer's own routes come from their profile, never from code (D-060): a transfer from their current
   employer, or an open work permit that makes sponsorship irrelevant. */
const coKey=x=>String(x||"").toLowerCase().replace(/&/g," and ").replace(/\b(inc|ltd|llc|corp|corporation|company|co|ulc|canada)\b/g,"").replace(/[^a-z0-9]/g,"");
const WORK_STATUS={unknown:"Not set yet (work-permit checks show as information only)",needs_permit:"I'll need an employer to support a work permit",open_permit:"I have an open work permit (I can work for any employer in Canada)",
  no_permit:"I'm a Canadian citizen or permanent resident (no work permit needed)"};
const statusUnknown=()=>(S.profile||{}).work_status==="unknown";
const permitFree=()=>["open_permit","no_permit"].includes((S.profile||{}).work_status);
function pw(j){
  const base=j.pathway||{score:45,signals:[]}, prof=S.profile||{}, emp=((prof.current||{}).employer||"").trim();
  const limits=base.signals.find(x=>x.label.startsWith("Posting limits"));
  if(prof.work_status==="no_permit")
    return {score:100,signals:[{label:"No work permit needed",status:"Strong route",detail:"You're a Canadian citizen or permanent resident, so sponsorship doesn't apply."}]};
  if(prof.work_status==="open_permit"){
    const hard=limits&&/citizen|permanent resident|clearance/i.test(limits.detail||"");
    return {score:hard?15:95,signals:[{label:"You have an open work permit",status:"Strong route",detail:"You can work for any employer in Canada, so whether they sponsor doesn't matter."},...base.signals.filter(x=>!x.label.startsWith("Posting limits")||hard)]};
  }
  if(emp&&coKey(emp)&&coKey(emp)===coKey(j.company))
    return {score:95,signals:[{label:"Intra-company transfer",status:"Strong route",detail:`You work at ${emp} today, so a transfer to its Canadian office may not need an LMIA.`},...base.signals.filter(x=>x.status!=="Unknown")]};
  return base;
}
/* Pay sub-score from the viewer's own pay targets (Profile), not a fixed band. */
function payScore(top,kind){const c={...DEFAULT_PREFS.checks,...(S.prefs.checks||{})},g=c.pay_green,y=c.pay_yellow;
  let v=top>=g*1.2?95:top>=g?80:top>=y?60:top>=y*0.8?40:20;return ["base","unspecified",undefined].includes(kind)?v:Math.max(20,v-10)}
/* Fit scores were made for one field (fit.field; older scores: product management). If your field is different,
   the role factor comes from how close the job is to your field until the next run re-scores it for you (D-076). */
function roleWhy(j){const v=famById(j.via);return v?`${v.label}: ${j.aff[j.via]} of 100 of this job${j.via===j.family?"":` (its main type is ${(famById(j.family)||{}).label||"another"})`}, ${TIER_WORD[j.tier]||""}.`:"Not the kind of work you picked."}
/* Company types you'd rather avoid (prefs.avoid_types, D-077): the domain factor is capped unless pay is top of range. */
function coType(name){const c=(S.companies||[]).find(x=>x.name===name);return c&&c.type||null}
function avoidHit(j){const t=coType(j.company);if(!t||!(S.prefs.avoid_types||[]).includes(t)) return false;
  const m=payInfo(j).main, ck={...DEFAULT_PREFS.checks,...(S.prefs.checks||{})};return !(m&&m.max&&m.currency!=="USD"&&m.max>=ck.pay_green)}
function fieldChanged(j){const f=(j.fit&&j.fit.field)||["pm"], m=myFams();return f.length!==m.length||f.some(x=>!m.includes(x))}
function subVal(j,k){
  if(k==="freshness") return freshness(j).score;
  if(k==="role"&&(j.aff_src==="read"||(j.fit&&fieldChanged(j)))) return j.rel||0;   // from type scores: instant when your field changes
  if(k==="domain"&&avoidHit(j)) return Math.min(35,+((j.fit&&j.fit.subs)||{}).domain||35);
  if(k==="pathway") return +pw(j).score||0;
  if(k==="pay"){const pi=payInfo(j),m=pi.main;
    if(m&&m.max&&m.currency!=="USD") return payScore(m.interval==="hour"?m.max*2000:m.max,m.kind);
    if(pi.est&&pi.est.max) return Math.min(payScore(pi.est.max,"base"),75);}  // estimates count, capped: they're uncertain
  return +((j.fit&&j.fit.subs)||{})[k]||0;
}
function pathwayWhy(j){const g=pw(j).signals||[];return g.length?g.map(x=>`${x.label} (${x.status.toLowerCase()})`).join("; "):""}
const SIG_CLASS={"Strong route":"s-stated","Stated":"s-stated","Inferred":"s-inferred","Unknown":"s-unknown"};
function pathwayChips(j){
  const g=pw(j).signals||[];
  return g.filter(x=>x.status!=="Unknown").slice(0,2).map(x=>{
    const bad=x.label.startsWith("Posting limits");
    const short=x.label==="Intra-company transfer"?"Internal transfer":x.label.startsWith("Hires from abroad")?"Hires from abroad":bad?"No sponsorship":"Sponsorship offered";
    return `<span class="chip ${bad?"s-none":SIG_CLASS[x.status]||""}" title="${esc(x.detail||"")}">${esc(short)} · ${esc(x.status)}</span>`;}).join("");
}
const managesPeople=j=>j.fit?!!j.fit.people_mgmt:!!j.people_mgmt;
/* Preference checks (D-059): green / yellow / red against the viewer's own preferences, all from their Profile (D-005, D-060). */
const CHECK_ICON={good:"✓",warn:"~",bad:"✕"};
const REGION_SHORT={"GTA":"Toronto area","Waterloo Region":"Waterloo","Remote-Canada":"Remote in Canada","Other Canada":"Elsewhere in Canada"};
function levelNums(j){const g=(j.fit&&j.fit.level_guess)||"";return (g.match(/L(\d)/g)||[]).map(x=>+x.slice(1))}
function prefChecks(j){
  const c={...DEFAULT_PREFS.checks,...(S.prefs.checks||{})}, out=[];
  // where
  const rg=j.region||"";
  const green=S.prefs.regions||c.green_regions;
  out.push(green.includes(rg)?{k:"Location",l:"good",t:REGION_SHORT[rg]||rg,why:"In your preferred locations"}
    :{k:"Location",l:"warn",t:REGION_SHORT[rg]||rg||"Canada",why:"In Canada, outside your preferred locations (would mean moving)"});
  // work permit
  const pwj=pw(j), ps=+pwj.score, sig=(pwj.signals||[])[0];
  if(permitFree()&&ps>=80){}   // nothing to check: you can work for any employer (a posting limited to citizens still shows red)
  else out.push(ps>=80?{k:"Work permit",l:"good",t:sig&&sig.label==="Intra-company transfer"?"Internal transfer":sig&&sig.label.startsWith("You have an open")?"You have an open permit":sig&&sig.label.startsWith("Sponsorship")?"Sponsorship offered":"Hires from abroad",why:pathwayWhy(j)||"Strong evidence they hire people from other countries"}
    :ps<=20?{k:"Work permit",l:statusUnknown()?"warn":"bad",t:"No sponsorship",why:(statusUnknown()?"Information only until you say whether you need a work permit. ":"")+(pathwayWhy(j)||"The posting says you must already be allowed to work in Canada")}
    :ps>=55?{k:"Work permit",l:"warn",t:"Sponsors sometimes",why:pathwayWhy(j)||"A few approvals to hire from abroad, mostly non-tech roles"}
    :{k:"Work permit",l:"warn",t:"Sponsorship unknown",why:pathwayWhy(j)||"No public record either way of hiring from abroad"});
  // pay
  const pi=payInfo(j), m=pi.main;
  if(m&&m.max&&m.currency!=="USD"){const top=m.interval==="hour"?m.max*2000:m.max, base=["base","unspecified",undefined].includes(m.kind);
    out.push({k:"Pay",l:top>=c.pay_green?"good":top>=c.pay_yellow?"warn":"bad",t:`${rangeText(m)}${base?"":" incl. bonus"}`,
      why:`Posted top of range vs your targets (green from CA$${c.pay_green/1000}K, yellow from CA$${c.pay_yellow/1000}K)`});}
  else if(pi.est){   // an estimate is green only at high confidence

    for(const l of lines){
      if(l.startsWith("## ")){flush();out+=`<h4>${esc(l.slice(3))}</h4>`}
      else if(/^[-•·*●▪–]\s*/.test(l)) list.push(l.replace(/^[-•·*●▪–]\s*/,""));

function applyBuilder(prof,a){   // instant value from the answers; the next run writes the headline and summary
  const list=x=>x.split(/[,\n]/).map(t=>t.trim()).filter(Boolean);

/* Score quality (P1-S5): does the ranking agree with your own triage, and does Lodestone read postings correctly?
   The ranking check is computed live from your triage and current settings, so it changes as you triage. */
function rankingCheck(){
  const live=Object.values(S.jobs).filter(j=>j.live), sc={};live.forEach(j=>{const f=fitScore(j);if(f!=null)sc[j.id]=f});
  const order=Object.keys(sc).sort((a,b)=>sc[b]-sc[a]), rank={};order.forEach((id,i)=>rank[id]=i+1);
  const lab=Object.entries(S.triage).filter(([id,t])=>t&&["interested","later","not"].includes(t.status)&&sc[id]!=null);
  const pos=lab.filter(([,t])=>t.status==="interested").map(([id])=>id), neg=lab.filter(([,t])=>t.status!=="interested").map(([id])=>id);
  let w=0,n=0;pos.forEach(p=>neg.forEach(q=>{n++;w+=sc[p]>sc[q]?1:sc[p]===sc[q]?0.5:0}));
  const rs={};Object.keys(sc).forEach(id=>rs[id]=rankScore(S.jobs[id]));   // learning never uses a role's own signal, so this is a fair test
  let w2=0;pos.forEach(p=>neg.forEach(q=>{w2+=rs[p]>rs[q]?1:rs[p]===rs[q]?0.5:0}));
  return {pos:pos.length,neg:neg.length,pairwise:n?w/n:null,learned:n?w2/n:null,top25:pos.filter(id=>rank[id]<=25).length,ranked:order.length,
    misses:pos.filter(id=>rank[id]>25).map(id=>({id,rank:rank[id]})).sort((a,b)=>a.rank-b.rank).slice(0,3)};
}
function qualityPanel(){
  if(!S.ready) return "";

  const pct=x=>x==null?"–":Math.round(x*100)+"%";
  const acc=rd&&rd.accuracy?Object.entries(rd.accuracy).filter(([,v])=>v!=null):[];
  const NAMES={pay:"pay amounts",pay_kind:"pay type",region:"location",people_mgmt:"people management",level:"level",years:"years of experience",excluded:"filtering out non-roles"};
  const rs=S.rescore, af=S.affStat;
  const fresh=rs&&rs.waiting>0?`<p class="note">${rs.waiting} roles still to be re-scored for your latest Profile, best matches first, about ${rs.cap||150} a day (roughly ${Math.ceil(rs.waiting/(rs.cap||150))} more day${Math.ceil(rs.waiting/(rs.cap||150))===1?"":"s"}). Your top roles are already up to date. Where you want to work, pay targets and role types apply straight away.</p>`

  return `${pfHead("check")}${fresh}${affLine}
    <dl class="facts">

      <dt>Order</dt><dd>${r.pairwise!=null?`Interested roles score above your Later / Not for me roles <b>${pct(r.pairwise)}</b> of the time (50% would be a coin flip).${r.learned!=null?` With what Lodestone learned from your choices: <b>${pct(r.learned)}</b>.`:""}`:"Needs at least one Interested and one Later or Not for me role."}</dd>

  </section>`;
}

    else if(d.ob==="skipall") obFinish(true);
    render();window.scrollTo(0,0);return}
  if(d.obf){obCapture();const a=obState().a,v=d.v;
    if(d.obf==="city"){a.cities=a.cities.includes(v)?a.cities.filter(x=>x!==v):[...a.cities,v];a.anywhere=false}
    else if(d.obf==="anywhere"){a.anywhere=!a.anywhere;if(a.anywhere)a.cities=[]}
    else if(d.obf==="country") a.other=v==="other";
    else if(d.obf==="status") a.status=v;
    else if(d.obf==="fam"){if(!a.families.length)a.families=famsInText(a.role_text);a.families=a.families.includes(v)?a.families.filter(x=>x!==v):[...a.families,v];if(!a.families.length)a.role_text_off=true}
    render();return}
  if(d.obt){const t=obState().a.taste,v=+d.obt;t[d.id]=t[d.id]===v?0:v;render();return}
  if(d.sacc){acceptSuggestion(d.sacc);return}
  if(d.sdis){dismissSuggestion(d.sdis);return}
  if(d.undo){undoLearned(d.undo);return}
  if(d.unhide){savePatch({hidden_companies:(S.prefs.hidden_companies||[]).filter(c=>c!==d.unhide)});return}
  if(d.act==="delreading"){deleteReading();return}
  if(d.like){e.stopPropagation();const j=jobById(d.id);if(j)like(j,+d.like);return}
  if(d.act==="note"){S.dtab="summary";lsSet("dtab","summary");render();const n=document.getElementById("notes");if(n){n.focus();n.scrollIntoView({block:"center"})}return}
  if(d.act==="fresh"){S.open="__fresh";render();return}
  if(d.act==="close"){if(S.open==="__fresh"){S.open=null;render()}else closeJob();return}
  if(d.act==="addjob"){addJob();return}
  if(d.sug){e.stopPropagation();decideCompany(d.key,d.sug);return}
  if(d.act==="suguall"){S.sugAll=true;render();return}
  if(d.dtab){S.dtab=d.dtab;lsSet("dtab",d.dtab);render();const tb=document.getElementById("dt-"+d.dtab);if(tb)tb.focus();return}
  if(d.cofilter){S.view="digest";S.q=d.cofilter;S.show="all";S.region="all";S.open=null;S.sel=0;render();window.scrollTo(0,0);return}
  if(d.act==="mreq"){e.stopPropagation();const j=jobById(d.id);if(j)requestMarket(j);return}
  if(d.act==="saveprefs"){savePrefs();return}
  if(d.act==="resetw"){SUBS.forEach(k=>{const i=document.getElementById("w-"+k);if(i)i.value=DEFAULT_PREFS.weights[k]});updateWeightLabels();S._editingPrefs=true;markDirty();return}
  if(d.open!==undefined&&!e.target.closest(".triage,.reasons,.ask,a,select")){openJob(d.open,d.idx!=null&&d.idx!==""?+d.idx:null)}
});
document.addEventListener("keydown",e=>{   // arrow keys move between detail tabs (ARIA tabs pattern)
  const t=e.target; if(!t||t.getAttribute("role")!=="tab"||!["ArrowLeft","ArrowRight","Home","End"].includes(e.key)) return;
  e.preventDefault(); e.stopPropagation();
  const i=DTABS.findIndex(([k])=>k===t.dataset.dtab), n=e.key==="Home"?0:e.key==="End"?DTABS.length-1:(i+(e.key==="ArrowRight"?1:-1)+DTABS.length)%DTABS.length;
  S.dtab=DTABS[n][0];lsSet("dtab",S.dtab);render();const tb=document.getElementById("dt-"+S.dtab);if(tb)tb.focus();
},true);
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){S.q=t.value;S.sel=0;render()}
  else if(t.id==="ob-role"){const a=obState().a;a.role_text=t.value;const n=document.getElementById("ob-heard");if(!a.families.length&&!a.role_text_off){const h=famsInText(t.value);if(n)n.innerHTML=heardText(h);document.querySelectorAll('[data-obf="fam"]').forEach(b=>b.setAttribute("aria-pressed",String(h.includes(b.dataset.v))))}}
  else if(t.id==="coq"){S.coQ=t.value;render()}
  else if(t.dataset.w){updateWeightLabels();S._editingPrefs=true;markDirty()}
  else if(S.view==="settings"&&t.closest("#view")&&!t.closest("#xp-build")){S._editingPrefs=true;markDirty()}
  else if(S.view==="settings") S._editingPrefs=true;
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="region"){S.region=t.value;S.sel=0;lsSet("ui",{view:S.view,sort:S.sort,region:S.region,yrs:S.yrs});render()}
  else if(t.id==="yrs"){S.yrs=t.value;S.sel=0;lsSet("ui",{view:S.view,sort:S.sort,region:S.region,yrs:S.yrs});render()}
  else if(t.id==="sort"){S.sort=t.value;lsSet("ui",{view:S.view,sort:S.sort,region:S.region,yrs:S.yrs});render()}
  else if(t.id==="stage"){const j=jobById(t.dataset.id);if(j)writeTriage(j,{stage:t.value||null,...(t.value&&!tri(j.id)?.status?{status:"interested"}:{})})}
  else if(t.dataset.move!==undefined){const id=t.dataset.move,j=jobById(id),cur=tri(id)||{};
    const body={...cur,stage:t.value||null,updated_at:new Date().toISOString()};S.triage={...S.triage,[id]:body};render();
    if(S.db) S.db.doc("triage/"+id).set(body).catch(()=>toast("Couldn't save. Try again."));}
  else if(t.id==="cvfile"){uploadResume(t.files&&t.files[0]);t.value=""}
  else if(t.id==="notes"){const j=jobById(t.dataset.id);if(j&&(tri(j.id)||{}).notes!==t.value)writeTriage(j,{notes:t.value})}
});
function updateWeightLabels(){const v={};SUBS.forEach(k=>v[k]=+(document.getElementById("w-"+k)||{}).value||0);const tot=SUBS.reduce((a,k)=>a+v[k],0);SUBS.forEach(k=>{const s=document.getElementById("wv-"+k);if(s)s.textContent=(tot?Math.round(v[k]*100/tot):0)+"%"})}
async function savePrefs(){
  if(!S.db){toast("Your profile saves inside claude.ai only.");return}
  const val=id=>document.getElementById(id);
  const regions=[...document.querySelectorAll("[data-region]")].filter(i=>i.checked).map(i=>i.dataset.region);
  const mine=[...document.querySelectorAll("[data-myfam]")].filter(i=>i.checked).map(i=>i.dataset.myfam);
  const fmine=mine.length?mine:myFams(), also=[...document.querySelectorAll("[data-alsofam]")].filter(i=>i.checked).map(i=>i.dataset.alsofam).filter(f=>!fmine.includes(f));
  const raw={};SUBS.forEach(k=>raw[k]=+val("w-"+k).value||0);const tot=SUBS.reduce((a,k)=>a+raw[k],0)||1;
  const weights={};SUBS.forEach(k=>weights[k]=Math.round(raw[k]*100/tot));
  const clamp=(x,a,b,d)=>{x=Math.round(+x);return isFinite(x)?Math.min(b,Math.max(a,x)):d};
  const avoid=[...(S.prefs.avoid_types||[]).filter(t=>t!=="traditional_fi"),...(val("avoidfi").checked?["traditional_fi"]:[])];
  const body={...(S.prefsRaw||{}),regions,families:fmine,families_shown:also,avoid_types:avoid,other_regions:val("other").checked,exclude_people_mgmt:val("xpm").checked,
    include_no_pay:val("nopay").checked,today_size:clamp(val("tsize").value,3,30,10),learn_reading:val("lread").checked,digest_size:clamp(val("dsize").value,1,100,20),later_days:clamp(val("ldays").value,1,60,7),report_days:clamp(val("rdays").value,1,90,14),
    checks:{green_regions:regions,pay_green:clamp(val("ck-payg").value,50000,600000,190000),pay_yellow:clamp(val("ck-payy").value,30000,600000,160000),
      level_green:clamp(val("ck-lg").value,3,9,6),level_yellow:clamp(val("ck-ly").value,3,9,5),fresh_green:clamp(val("ck-fg").value,1,120,14),fresh_yellow:clamp(val("ck-fy").value,1,365,30)},max_age_days:clamp(val("maxage").value,0,365,0),weights,updated_at:new Date().toISOString()};
  const prof={...(S.profile||{version:0})};
  prof.current={...(prof.current||{}),employer:val("pf-employer").value.trim(),title:val("pf-title").value.trim(),level:val("pf-level").value.trim()};
  prof.location_now=val("pf-where").value.trim();prof.work_status=val("pf-work").value;
  PROFILE_FIELDS.forEach(([k])=>{const v=val("pf-"+k).value.trim();prof[k]=Array.isArray((S.profile||{})[k])||k!=="headline"&&k!=="summary"?v.split("\n").map(x=>x.trim()).filter(Boolean):v});
  prof.preferences={...(prof.preferences||{}),domains_wanted:val("pf-dw").value.trim(),families:fmine,families_shown:also,role_families:fmine.map(f=>(famById(f)||{}).label).filter(Boolean)};
  const ba=document.getElementById("xp-build")&&!document.getElementById("xp-build").hidden?builderAnswers():null; if(ba) applyBuilder(prof,ba);
  const cv=val("cvtext"); if(cv&&cv.value.trim()&&cv.value.trim()!==((prof.resume||{}).text||"")) prof.resume={...(prof.resume||{}),text:cv.value.trim().slice(0,40000),uploaded_at:new Date().toISOString(),status:"uploaded"};
  prof.version=(+prof.version||0)+1;prof.edited_at=new Date().toISOString();
  try{await S.db.doc("settings/prefs").set(body);await S.db.doc("profile/main").set(prof);S._editingPrefs=false;S.prefsRaw=body;S.prefs={...DEFAULT_PREFS,...body};if(body.learn_reading===false)flushReading();refreshToday();lsSet("welcomed",true);render();toast("Profile saved. Today's list now follows it.")}
  catch(e){toast("Couldn't save your profile. Try again.");console.warn(e)}
}
async function addJob(){
  const box=document.getElementById("paste");const text=(box&&box.value||"").trim();
  if(!text){toast("Paste a link or a job description first.");return}
  if(!S.db){toast("Adding jobs works inside claude.ai only.");return}
  try{await S.db.collection("inbox").add({text:text.slice(0,20000),created_at:new Date().toISOString(),status:"new"});box.value="";toast("Added. It's processed at the next update (about 7am, 1pm or 6pm New York time).")}
  catch(e){toast(e&&e.code==="quota_exceeded"?"The inbox is full. It clears at the next update; try again after that.":"Couldn't add it. Try again.");console.warn(e)}
}
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea,select")) return;
  if(e.key==="Escape"&&S.open){closeJob();return}
  if(S.view!=="digest"||S.open&&e.key!=="Escape") return;
  const list=S._order||[];if(!list.length) return;
  const k=e.key.toLowerCase();
  if(k==="j"||k==="k"){S.sel=Math.max(0,Math.min(list.length-1,S.sel+(k==="j"?1:-1)));render();const c=document.querySelector(".card.sel");if(c){c.focus();c.scrollIntoView({block:"nearest"})}e.preventDefault()}
  else if(k==="enter"||(k===" "&&e.target.classList.contains("card"))){
    if(e.target.closest("button,a")) return;   // Enter on a button does that button
    const c=e.target.closest(".card");
    const i=c?+c.dataset.idx:S.sel;if(list[i]){e.preventDefault();openJob(list[i].id,i)}}
  else if(k==="i"||k==="l"||k==="n"){triage(list[S.sel],{i:"interested",l:"later",n:"not"}[k]);
    S.sel=Math.min(list.length-1,S.sel+1);render();document.querySelector(".card.sel")?.focus()}
});
document.addEventListener("paste",e=>{
  if(e.target.closest("input,textarea")) return;
  const txt=(e.clipboardData||window.clipboardData)?.getData("text");if(!txt) return;
  setView("add");setTimeout(()=>{const b=document.getElementById("paste");if(b){b.value=txt;b.focus()}},0);
});
boot();
</script>
