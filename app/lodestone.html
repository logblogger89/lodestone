<style>
/* Layout: app shell. Left rail on wide screens, bottom tab bar on iPad/phone; content column max 1100px.

  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --good:#6fcf9b; --good-soft:#173528; --warn:#e6b45c; --warn-soft:#3a2d12; --unk:#a7acb5; --unk-soft:#262b33; --bad:#ec8a80; --bad-soft:#3b1d1a;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#16202a; --surface-2:#1d2935; --line:#2b3a47;
  --fg:#e6ecf0; --muted:#9aa8b3; --accent:#7fb0e0; --accent-fg:#0b1620; --accent-soft:#1d3247;
  --good:#6fcf9b; --good-soft:#173528; --warn:#e6b45c; --warn-soft:#3a2d12; --unk:#a7acb5; --unk-soft:#262b33; --bad:#ec8a80; --bad-soft:#3b1d1a;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45}

.brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;color:var(--muted);min-height:44px}

.nav .count{margin-left:auto;font-family:var(--font-mono);font-size:12px}
.main{min-width:0;padding-block:18px 96px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar h1{font-family:var(--font-display);font-size:26px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.topbar .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.fresh{font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:32px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--fg);border:1px solid transparent;white-space:nowrap}
.chip.t-core{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.t-adjacent{background:var(--good-soft);color:var(--good)}
.chip.t-stretch{background:var(--unk-soft);color:var(--unk)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad);font-weight:600}
.toggle{cursor:pointer;border-color:var(--line);background:var(--surface);min-height:30px}
.toggle[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input[type=search]{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;min-height:40px}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;min-height:40px}
.summary{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:baseline;color:var(--muted);font-size:14px}

.list{display:flex;flex-direction:column;gap:10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:start;cursor:pointer}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.done{opacity:.6}
.card h3{margin:0;font-size:16px;font-weight:600;line-height:1.3}
.co{color:var(--fg);font-weight:500}
.meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px;margin:2px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.pay{font-family:var(--font-mono);font-size:13px;font-weight:500}
.pay small{font-family:var(--font-body);font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}
.pay.us{font-weight:400;color:var(--muted)}
.paymore{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.nopay{font-size:12px;color:var(--muted)}
.payrows{display:flex;flex-direction:column;gap:2px}
.payrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:8px 10px;border-radius:8px;font-size:13px}
.payrow .lbl{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.payrow .amt{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.payrow.main{background:var(--accent-soft)}
.payrow.main .lbl{color:var(--fg);font-weight:600}
.payrow.main .amt{font-size:16px;font-weight:600;color:var(--fg)}
.payhead{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 10px 0}
details.quotes summary{cursor:pointer;font-size:12px;color:var(--muted)}
.est-pay{color:var(--muted);font-weight:400}
.payrow.est-row{border:1px dashed var(--warn);border-radius:8px}
.payrow.mkt-row{border:1px solid var(--line);border-radius:8px}
.rbanner{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;background:var(--surface);padding:12px 14px;margin:0 0 14px;cursor:pointer;color:var(--fg)}
.rbanner small{display:block;color:var(--muted);margin-top:4px}
.report h3{margin:18px 0 6px;font-size:14px}
.report ul{margin:0;padding-left:18px}
.report li{margin:3px 0}
.report .stats{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:13px;margin:6px 0 4px}
.report .stats strong{color:var(--fg);font-family:var(--font-mono)}
.report .actions{border:1px solid var(--warn);border-radius:8px;padding:8px 12px;margin-top:12px}
.archive details{border-top:1px solid var(--line);padding:10px 0}
.archive summary{cursor:pointer}
.card.sug{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;cursor:default}
.panel button.link{border:0;background:none;padding:0;cursor:pointer;color:var(--accent);font-weight:600}
button.plink{border:0;background:none;padding:0;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.ck{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px 2px 7px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.ck b{font-size:11px}
.ck-good{background:var(--good-soft);color:var(--good)}
.dtabs{display:flex;flex-shrink:0;gap:4px;border-bottom:1px solid var(--line);margin:0;position:sticky;top:-18px;background:var(--bg);overflow-x:auto;z-index:2;padding-top:6px}
.dtabs button{flex-shrink:0;white-space:nowrap;border:0;background:none;padding:10px 12px;min-height:44px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.dtabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.drawer>*{flex-shrink:0}
@media (max-width:520px){.drawer .actrow .btn.primary{flex-basis:100%;text-align:center}.dtabs button{padding:10px 7px;font-size:14px}}
.panel.jd p{margin:0 0 10px;line-height:1.55}
.panel.jd h4{margin:16px 0 6px;text-transform:none;letter-spacing:0;font-size:15px;color:var(--fg)}
.panel.jd ul{margin:0 0 10px;padding-left:20px}.panel.jd li{margin:4px 0;line-height:1.5}
.panel.jd mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 2px}
.ck.info{background:var(--surface);color:var(--fg);border-color:var(--line)}
.ck.tier{background:var(--surface-2);color:var(--fg);border-color:var(--line);font-weight:600}
.ck.tier.t-core{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.flabel{font-size:12px;color:var(--muted);align-self:center}
.legend{margin:2px 0 12px;font-size:13px;color:var(--muted)}
.legend summary{cursor:pointer;width:max-content}
.legend p,.legend ul{margin:8px 0 0}
.legend li{margin:4px 0}
.ck-warn{background:var(--warn-soft);color:var(--warn)}
.ck-bad{background:var(--bad-soft);color:var(--bad);font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.card.sug ul{margin:0;padding-left:18px}
.archive h2{font-family:var(--font-display);font-size:18px;margin:22px 0 4px}
.report button.link{border:0;background:none;padding:0;text-align:left;cursor:pointer;font-weight:600;color:var(--accent)}
.kind{font-family:var(--font-body);font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:1px 5px;margin-left:6px}
.payrow .sub{display:block;font-size:11px;color:var(--muted);font-weight:400}
.payrow.eq{border-top:1px dashed var(--line);border-radius:0;margin-top:4px}
.src-line{font-size:12px;color:var(--muted);margin:4px 0 0}
mark{background:var(--accent-soft);color:var(--fg);border-radius:3px;padding:0 2px}
mark.w{background:var(--warn-soft)}
details.quotes blockquote{margin:6px 0 0;padding:6px 10px;border-left:2px solid var(--line);font-size:12px;color:var(--muted)}
.srcs{display:inline-flex;gap:4px;flex-wrap:wrap}
a.src{font-size:11px;font-weight:600;font-family:var(--font-mono);text-decoration:none;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:2px 6px;white-space:nowrap}
a.src:hover{border-color:var(--accent);color:var(--accent)}
.compass{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;text-align:center;font-size:10px;line-height:1.1;color:var(--muted);position:relative}
.compass b{display:block;font-family:var(--font-display);font-size:15px;color:var(--fg)}
.compass.core{border-color:var(--accent)} .compass.core b{color:var(--accent)}
.compass.adjacent{border-color:var(--good)} .compass.adjacent b{color:var(--good)}
.ring{position:relative;width:56px;height:56px}
.ring .cap{position:absolute;left:0;right:0;top:36px;text-align:center;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ring svg{width:56px;height:56px;display:block}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-mono);font-weight:500;font-size:16px;color:var(--fg)}
.ring .trk{stroke:var(--surface-2)} .ring .arc{stroke:var(--accent)} .ring .ndl{fill:var(--accent)}
.stale{color:var(--warn);font-weight:600}
.chip.s-stated{background:var(--good-soft);color:var(--good)}
.chip.s-inferred{background:var(--warn-soft);color:var(--warn)}
.chip.s-unknown{background:var(--unk-soft);color:var(--unk)}
.chip.s-none{background:var(--bad-soft);color:var(--bad)}
.fitsum{font-size:13px;color:var(--muted);margin:-4px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{display:grid;grid-template-columns:76px minmax(0,1fr) 34px;gap:4px 10px;align-items:center;font-size:13px}
.bar .track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent)}
.bar .why{grid-column:2 / 4;color:var(--muted);font-size:12px;margin-bottom:4px}
.bar .w{font-size:11px;color:var(--muted)}
.overall{display:flex;align-items:center;gap:14px}
.overall p{margin:0;font-size:14px}
.triage{display:flex;flex-direction:column;gap:6px}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:100px;min-height:36px;cursor:pointer;font-size:13px}
.tbtn.on-interested{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.tbtn.on-later{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:600}
.tbtn.on-not{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.reasons button{font-size:12px;border:1px dashed var(--line);background:none;border-radius:999px;padding:4px 10px;cursor:pointer;min-height:30px}
.reasons button[aria-pressed="true"]{border-style:solid;border-color:var(--bad);color:var(--bad)}
.more{align-self:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h2{font-family:var(--font-display);font-size:20px;margin:0;color:var(--fg)}
/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:21;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:14px}
.drawer h2{font-family:var(--font-display);font-size:22px;margin:0;text-wrap:balance}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}

.facts dt{color:var(--muted)} .facts dd{margin:0;min-width:0;overflow-wrap:anywhere}

.tblwrap{overflow-x:auto}
.note{font-size:12px;color:var(--muted)}
.soon{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px}

.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.col h4{margin:0 2px 2px;font-size:13px;display:flex;justify-content:space-between}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.pcard button.link{border:0;background:none;padding:0;text-align:left;cursor:pointer;font-weight:600;color:var(--fg)}
.pcard select,.field select{font-size:13px;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.flag{font-size:11px;font-weight:600;color:var(--bad)}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500}
textarea,input:not([type]),input[type=text],input[type=number],.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;width:100%}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}

.switch:last-child{border-bottom:0}

.toast{max-width:calc(100% - 32px);word-break:break-word;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30}
.tabbar{display:none}

  .tabbar button{border:0;background:none;min-height:48px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}

</style>

    <button data-view="add">Add</button>
    <button data-view="reports">Reports</button>
    <button data-view="companies">Companies</button>
    <button data-view="settings">Profile</button>
  </nav>
</div>
<div id="overlay"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
"use strict";
/* ---------- constants (defaults mirror PRD/UX decisions; real values live in settings/prefs) ---------- */
const STAGES = ["Shortlisted","Applied","Screen","Interviewing","Offer","Closed"];
const TIERS = ["Core","Adjacent","Stretch"];
const TIER_HELP = {Core:"Core PM role", Adjacent:"Adjacent role (TPM, program, strategy & ops, chief of staff, trust & safety)", Stretch:"Stretch role (product marketing, solutions, analytics)"};
const TIER_NAME = {Core:"Core PM", Adjacent:"PM-adjacent", Stretch:"Stretch"};
const TIER_WHAT = {Core:"Product manager role", Adjacent:"TPM, program, strategy & ops, chief of staff or trust & safety", Stretch:"Product marketing, solutions engineering or analytics"};
const REGIONS = ["GTA","Waterloo Region","Remote-Canada","Ottawa","Montreal","Vancouver","Calgary","Edmonton","Other Canada"];
const SUBS = ["role","level","domain","pathway","pay","skills","freshness"];
const SUBLABEL = {role:"Role",level:"Level",domain:"Domain",pathway:"Work permit",pay:"Pay",skills:"Skills",freshness:"Freshness"};
/* A weight saved before a factor existed falls back to its default (so freshness counts for older settings). */
const wv=(W,k)=>+(W&&W[k]!=null?W[k]:DEFAULT_PREFS_W[k])||0;
const NOT_REASONS = ["Level too junior","Not my domain","Location","People management","Pay too low","Company"];
const DEFAULT_PREFS = {
  regions:["GTA","Waterloo Region","Remote-Canada"], other_regions:true, tiers:["Core","Adjacent","Stretch"],
  exclude_people_mgmt:true, include_no_pay:true, digest_size:20, later_days:7, max_age_days:0,
  report_days:14,
  checks:{green_regions:["GTA","Waterloo Region","Remote-Canada"],pay_green:190000,pay_yellow:160000,level_green:6,level_yellow:5,fresh_green:14,fresh_yellow:30},
  weights:{role:22,level:18,domain:18,pathway:14,pay:9,skills:9,freshness:10}
};
const DEFAULT_PREFS_W = DEFAULT_PREFS.weights;
/* Freshness (computed here, so it changes daily without re-scoring): older postings are more likely filled.
   Uses the posting date; when a site gives none, the day Lodestone first saw the role, capped lower because
   the role may be older than that. */
function freshness(j){
  const posted=postedAt(j), seen=parseWhen(j.first_seen), ms=posted??seen;
  if(ms==null) return {score:50,days:null,why:"Posting date unknown"};
  const d=Math.max(0,Math.round((Date.now()-ms)/DAY));
  let v=d<=14?100:d<=30?85:d<=45?60:d<=60?30:d<=90?15:5;
  if(posted==null) v=Math.min(v,70);
  const why=posted!=null?(d<=14?`Posted ${d} day${d===1?"":"s"} ago`:`Posted ${d} days ago; older roles are more often filled`)
    :`No posting date; first seen by Lodestone ${d} day${d===1?"":"s"} ago`;
  return {score:v,days:d,why,dated:posted!=null};
}
const FRESH_LABEL = {jobs:"Job pulls (all sources)", source_index:"Source index", ats_detection:"Job-board detection",
  scoring:"Fit scoring", signals:"Pathway signals (ESDC)", discovery:"Company discovery", profile:"Your profile"};

/* ---------- state ---------- */
const S = {
  db:null, ready:false, offline:false, canWrite:true,
  jobs:{}, triage:{}, prefs:{...DEFAULT_PREFS}, companies:[], freshness:{}, inbox:[], mreq:{}, reports:[], suggestions:[], codec:{}, sugAll:false, desc:{}, cprof:{}, dtab:lsGet("dtab","summary"),
  view:"digest", open:null, sel:0, show:"todo", region:"preferred", q:"", tierOn:new Set(TIERS), sort:"best",
  coQ:"", coStatus:"all", expanded:false, lastVisit:null, pendingReasons:null
};
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u||"") ? u : "#";
function lsGet(k,d){try{const v=localStorage.getItem("lodestone:"+k);return v==null?d:JSON.parse(v)}catch{return d}}
function lsSet(k,v){try{localStorage.setItem("lodestone:"+k,JSON.stringify(v))}catch{}}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,4200)}

/* ---------- dates ---------- */
const DAY=864e5;
function parseWhen(v,base){
  if(v==null||v==="") return null;
  if(typeof v==="number") return v>1e12?v:v*1000;
  const s=String(v).trim();
  if(/^\d{9,13}$/.test(s)){const n=+s;return n>1e12?n:n*1000}
  let m=s.match(/posted\s+(today|yesterday|(\d+)\+?\s+days?\s+ago)/i);
  if(m){const d=/today/i.test(m[1])?0:/yesterday/i.test(m[1])?1:+m[2];return (base??Date.now())-d*DAY}   // "Posted 10 days ago" counts from when it was read
  const t=Date.parse(s.replace(/\s+/g," "));return isNaN(t)?null:t;
}
function ago(ms){
  if(ms==null) return "";
  const d=(Date.now()-ms)/DAY;
  if(d<1/24) return "just now"; if(d<1) return Math.round(d*24)+"h ago";
  if(d<2) return "1 day ago"; if(d<60) return Math.round(d)+" days ago";
  return Math.round(d/30)+" months ago";
}
const postedAt = j => parseWhen(j.posted_at, parseWhen(j.last_seen));
const postedMs = j => postedAt(j) ?? parseWhen(j.first_seen);

/* ---------- formatting ---------- */
function fmtK(n){n=+n;if(!isFinite(n)) return "";if(n<1000) return n%1?n.toFixed(2):String(n);return Math.round(n/1000)+"K"}
/* One range as posted (never converted, B8): CA$126K–176K, US$137.9K–256.1K, $45–55/hr. */
function rangeText(r){
  if(!r||(!r.min&&!r.max)) return "";
  const cur=(r.currency||"").toUpperCase(), sym=cur==="USD"?"US$":cur==="CAD"?"CA$":cur?cur+" ":"$";
  const per=r.interval==="hour"?"/hr":r.interval==="month"?"/mo":"";
  const lo=r.min?fmtK(r.min):"", hi=r.max?fmtK(r.max):"";
  return sym+(lo&&hi&&lo!==hi?lo+"–"+hi:(lo||hi))+per;
}
/* Pay object from refresh: {ranges:[...], primary: index|null, source, equity}. Older shape {min,max,...} is wrapped. */
function payInfo(j){
  let p=j.pay; if(p&&!p.ranges&&(p.min||p.max)) p={ranges:[p],primary:0,source:"field"};
  const ranges=(p&&p.ranges)||[]; const main=p&&p.primary!=null?ranges[p.primary]:null;
  return {ranges,main,others:ranges.filter(r=>r!==main),source:p&&p.source,equity:p&&p.equity,est:p&&p.estimate,
          checked:j.pay_checked!==false||ranges.length>0};
}
const payText=j=>{const pi=payInfo(j);return pi.main?rangeText(pi.main):""};
function shortLabel(l){return String(l||"").replace(/,?\s*Canada$/i,"").replace(/^Canada\s*-\s*/i,"").trim()}
/* What a range covers, in the posting's own terms. Base is the norm, so only other kinds get a card tag. */
const KIND={base:"Base salary",base_bonus:"Base + bonus",ote:"On-target earnings (incl. commission)",total:"Total compensation",unspecified:"Pay type not stated"};
const KIND_TAG={base_bonus:"incl. bonus",ote:"OTE",total:"total comp"};
function equityText(e){
  if(!e||!e.offered) return "";
  const a=(e.amounts||[])[0];
  if(a){const v=a.unit==="percent"?`${a.min}–${a.max}%`:a.unit==="shares"?`${fmtK(a.min)}–${fmtK(a.max)} options/shares`:rangeText({...a,interval:"year"});return v}
  return e.certainty==="possible"?"May be offered (amount not stated)":"Offered (amount not stated)";
}
/* Card: the Canadian range, its place, a tag when it isn't base pay, and quiet notes for other regions and equity. */
function payCard(j){
  const pi=payInfo(j), eq=pi.equity&&pi.equity.offered&&pi.equity.certainty!=="possible";
  const eqTag=eq?`<span class="paymore" title="Equity: ${esc(equityText(pi.equity))}">+ equity</span>`:"";
  if(pi.main){
    const lbl=shortLabel(pi.main.label), more=pi.others.length, tag=KIND_TAG[pi.main.kind];
    const usN=pi.others.filter(r=>r.canada===false||r.currency==="USD").length;
    const tip=[KIND[pi.main.kind||"unspecified"],pi.main.estimated?"employer's estimate":"",pi.main.currency?"":"currency not stated"].filter(Boolean).join(" · ");
    return `<span class="pay" title="${esc(tip)}">${esc(rangeText(pi.main))}${tag?`<span class="kind">${esc(tag)}</span>`:""}${lbl&&lbl.toLowerCase()!=="canada"?`<small>${esc(lbl)}</small>`:""}</span>${more?`<span class="paymore" title="This posting lists ${more} more range${more>1?"s":""}. Open the role to see them.">+${more} ${usN===more?"US":"more"}</span>`:""}${eqTag}`;
  }
  const estTag=pi.est?`<span class="pay est-pay" title="${esc(`Estimate (${pi.est.confidence} confidence): ${pi.est.basis}. Not posted by the employer.`)}">${esc(rangeText(pi.est))} <span class="est">est.</span></span>`:"";
  if(pi.ranges.length) return `${estTag}<span class="pay us" title="The posting lists pay for other countries only">${esc(rangeText(pi.ranges[0]))}<small>US range only</small></span>${eqTag}`;
  if(estTag) return estTag+eqTag;
  return (pi.checked?`<span class="nopay">No pay in posting</span>`:`<span class="nopay">Pay not checked yet</span>`)+eqTag;
}
/* Card extras next to the Pay check: equity, ranges for other places, and how an estimate was made. */
function payExtras(j){
  const pi=payInfo(j), eq=pi.equity&&pi.equity.offered&&pi.equity.certainty!=="possible", bits=[];
  if(pi.main&&pi.others.length){const usN=pi.others.filter(r=>r.canada===false||r.currency==="USD").length;bits.push(`+${pi.others.length} ${usN===pi.others.length?"US":"more"} range${pi.others.length>1?"s":""}`)}
  if(!pi.main&&pi.est) bits.push(`estimate: ${pi.est.confidence} confidence`);
  if(eq) bits.push("+ equity");
  return bits.map(b=>`<span class="paymore">${esc(b)}</span>`).join("");
}
/* Scorer flags, minus the ones a colour check already shows. */
const cardFlags=j=>((j.fit&&j.fit.flags)||[]).filter(f=>!/pay|salary|compensation|location|based|relocat|level|junior|senior|manag|old|posted/i.test(f)).slice(0,2);
/* Highlight the numbers and the words that say what they cover, inside the quoted sentence. */
function markQuote(q){
  return esc(q).replace(/((?:US|CA|C)?\$\s?\d[\d,]*(?:\.\d\d)?(?:\s?[kK]\b)?|\b\d{1,3}(?:,\d{3})+(?:\.\d\d)?(?:\s?(?:\$\s?)?(?:CAD|USD))?|\b\d+(?:\.\d+)?\s?%)/g,"<mark>$1</mark>")
    .replace(/\b(base (?:salary|pay|compensation)|inclusive of[^,.;]{0,40}bonus|including[^,.;]{0,30}(?:bonus|commission)|on[- ]target earnings|OTE|total (?:cash|compensation)|bonus|commission|equity|stock options?|RSUs?|estimated|expected)\b/gi,"<mark class=\"w\">$1</mark>");
}
function fmtDate(v){const ms=parseWhen(v);return ms?new Date(ms).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):""}
function sourceLine(j,pi){
  const s0=(j.sources||[])[0]; if(!s0) return "";
  const read=fmtDate(j.last_seen);
  const what=pi.source==="field"?`${esc(j.company)}'s salary data in ${esc(s0.label)} (structured field, not the posting text)`:`${esc(j.company)}'s posting on ${esc(s0.label)}`;
  return `<p class="src-line"><b>Source:</b> ${what}${read?` · read ${esc(read)}`:""} · <a href="${esc(safeUrl(s0.url))}" target="_blank" rel="noopener">Open posting ↗</a></p>`;
}
/* Detail: Canadian range highlighted, every other range below, equity, and exactly where it all came from. */
function payPanel(j){
  const pi=payInfo(j);
  const row=(r,main)=>`<div class="payrow${main?" main":""}"><span class="lbl">${esc(r.label||(r.currency==="USD"?"United States":"Location not stated"))}<span class="sub">${esc(KIND[r.kind||"unspecified"])}${r.estimated?" · employer's estimate":""}${!r.currency?" · currency not stated":""}</span></span><span class="amt">${esc(rangeText(r))}</span></div>`;
  let body;
  if(!pi.ranges.length) body=pi.checked?`<p class="nopay">The posting doesn't state a pay range.</p>`:`<p class="nopay">Lodestone hasn't read the full posting yet. Open it to check pay.</p>`;
  else body=`<div class="payrows">${pi.main?row(pi.main,true):`<p class="nopay">No Canadian range in this posting.</p>`}
      ${pi.others.length?`<div class="payhead">Other ranges in this posting</div>${pi.others.map(r=>row(r,false)).join("")}`:""}</div>`;
  const est=pi.est&&!pi.main?`<div class="payrow est-row"><span class="lbl">Estimate <span class="est">est.</span><span class="sub">${esc(pi.est.basis)} · ${esc(pi.est.confidence)} confidence · ${pi.est.n} posting${pi.est.n===1?"":"s"}</span></span><span class="amt">${esc(rangeText(pi.est))}</span></div>
    <details class="quotes"><summary>How this was estimated</summary><p class="note">Median of these posted Canadian base ranges${pi.est.basis.includes("adjusted")?", adjusted 15% per level":""}:</p>${(pi.est.examples||[]).map(x=>`<blockquote>${esc(x)}</blockquote>`).join("")}<p class="note">Ontario lets employers skip posting a range for roles over $200K, so posted ranges under-represent senior pay. Treat senior-level estimates as a floor.</p></details>`:"";
  const eq=pi.equity&&pi.equity.offered?`<div class="payrow eq"><span class="lbl">Equity<span class="sub">${pi.equity.certainty==="possible"?"Posting says the role may be eligible":"Posting says equity is part of the offer"}</span></span><span class="amt">${esc(equityText(pi.equity))}</span></div>`:"";
  const quotes=[...new Set([...pi.ranges.map(r=>r.quote),pi.equity&&pi.equity.quote].filter(Boolean))];
  const evidence=(pi.ranges.length||eq)?`${sourceLine(j,pi)}${quotes.length?`<details class="quotes"><summary>Show the exact wording</summary>${quotes.map(q=>`<blockquote>“${markQuote(q)}”</blockquote>`).join("")}</details>`:""}`:"";
  const mk=(j.pay||{}).market, k$=v=>"CA$"+Math.round(v/1000)+"K";
  const market=mk?`<div class="payrow mkt-row"><span class="lbl">Market check<span class="sub">levels.fyi · ${esc(j.company)} ${esc(mk.level)} · ${esc(mk.location)} · median total pay (base + stock + bonus)</span></span><span class="amt">${esc(k$(mk.median_total))}</span></div>
    <p class="note">${(mk.neighbours||[]).map(n=>`${esc(n.level)} ${esc(k$(n.median_total))}`).join(" · ")}${mk.note?" · "+esc(mk.note):""} · Data updated ${esc(mk.updated||"")}. <a href="${esc(safeUrl(mk.page_url))}" target="_blank" rel="noopener">Data source: Levels.fyi ↗</a></p>`
    :marketAsk(j);
  return `<section class="panel"><h4>Pay</h4>${body}${est}${eq}${market}${evidence}</section>`;
}
/* Market check requests (D-055): one levels.fyi read per role you ask for, answered by Claude's next session. */
const MREQ_DAILY=20;   // mirrors config/market.json daily_cap
const MREQ_MSG={requested:"Requested. Claude checks levels.fyi at its next session.",no_data:"levels.fyi has no Canadian figures for this company and role type.",failed:"The check failed. Tap to try again."};
function marketAsk(j){
  const r=S.mreq[j.id];
  if(r&&r.status==="requested") return `<p class="note mreq"><span class="est">Requested</span> ${MREQ_MSG.requested}</p>`;
  const msg=r&&MREQ_MSG[r.status]?`<span class="note">${esc(r.result||MREQ_MSG[r.status])}</span> `:"";
  if(r&&r.status==="no_data") return `<p class="note mreq">${msg}</p>`;
  return `<p class="note mreq">${msg}<button class="tbtn" data-act="mreq" data-id="${esc(j.id)}">Request market check</button> Median pay at this level from levels.fyi.</p>`;
}
async function requestMarket(j){
  if(!S.db||!S.canWrite){toast("Open Lodestone signed in as its owner to request a check.");return}
  const day=Date.now()-DAY, recent=Object.values(S.mreq).filter(r=>(parseWhen(r.requested_at)||0)>day).length;
  if(recent>=MREQ_DAILY){toast(`That's ${MREQ_DAILY} requests today. levels.fyi allows reads you ask for, not bulk pulls, so try again tomorrow.`);return}
  const body={status:"requested",requested_at:new Date().toISOString(),company:j.company,title:j.title};
  S.mreq={...S.mreq,[j.id]:body};render();
  try{await S.db.doc("market_req/"+j.id).set(body);toast("Requested. It's answered at Claude's next session.")}catch(e){toast("Couldn't save. Check your connection and try again.");console.warn(e)}
}
/* Pay sort: base (or unlabelled) ranges compete with each other; bonus-inclusive, OTE and total-comp ranges rank after them. */
const payMax=j=>{const pi=payInfo(j),m=pi.main;if(!m) return pi.est?(pi.est.max||0)-1:-1;const v=(m.interval==="hour"?m.max*2000:m.max)||0;return (["base","unspecified",undefined].includes(m.kind)?1e9:0)+v};
function where(j){return j.location||j.region||"Canada"}

/* ---------- derived ---------- */
function tri(id){return S.triage[id]||null}
function laterDue(t){return t&&t.status==="later"&&(Date.now()-(parseWhen(t.updated_at)||0))>(S.prefs.later_days||7)*DAY}
function inPreferred(j){
  const r=S.prefs.regions||[];
  return r.includes(j.region)||(S.prefs.other_regions&&!["GTA","Waterloo Region","Remote-Canada"].includes(j.region));
}
function matchesBase(j){
  if(!j.live) return false;
  if(!S.tierOn.has(j.tier)) return false;
  if(!(S.prefs.tiers||TIERS).includes(j.tier)) return false;
  if(S.prefs.exclude_people_mgmt&&managesPeople(j)) return false;
  if(+S.prefs.max_age_days>0){const fr=freshness(j);if(fr.dated&&fr.days>+S.prefs.max_age_days) return false}
  if(!S.prefs.include_no_pay&&!payText(j)) return false;
  if(S.region==="preferred"){if(!inPreferred(j)) return false}
  else if(S.region!=="all"&&j.region!==S.region) return false;
  if(S.q){const q=S.q.toLowerCase();if(!(j.title+" "+j.company+" "+j.location+" "+(j.department||"")).toLowerCase().includes(q)) return false}
  return true;
}
const isTodo=j=>{const t=tri(j.id);return !t||!t.status||laterDue(t)};
function matches(j){
  if(!matchesBase(j)) return false;
  const t=tri(j.id);
  if(S.show==="todo") return isTodo(j);
  if(S.show==="all") return true;
  return t&&t.status===S.show;
}
const TIER_RANK={Core:0,Adjacent:1,Stretch:2};
const PREF_RANK=r=>{const i=(S.prefs.regions||[]).indexOf(r);return i<0?9:i};
function sorted(list){
  const by={
    best:(a,b)=>((fitScore(b)??-1)-(fitScore(a)??-1))||TIER_RANK[a.tier]-TIER_RANK[b.tier]||PREF_RANK(a.region)-PREF_RANK(b.region)||(postedMs(b)||0)-(postedMs(a)||0),
    newest:(a,b)=>(postedMs(b)||0)-(postedMs(a)||0),
    company:(a,b)=>a.company.localeCompare(b.company)||a.title.localeCompare(b.title),
    pay:(a,b)=>payMax(b)-payMax(a)
  };
  return list.sort(by[S.sort]||by.best);
}
function visible(){return sorted(Object.values(S.jobs).filter(matches))}
const isNew=j=>S.lastVisit&&parseWhen(j.first_seen)>S.lastVisit;

/* ---------- db ---------- */
async function boot(){
  S.lastVisit=lsGet("lastVisit",null);
  try{ const v=lsGet("ui",{}); if(v.view) S.view=v.view; if(v.sort) S.sort=v.sort; if(v.region) S.region=v.region }catch{}
  render();
  const use=n=>{try{return Promise.resolve(window.claude?.use?.(n)??null).catch(()=>null)}catch{return Promise.resolve(null)}};
  const db=await use("db");
  if(!db){S.offline=true;render();return}
  S.db=db;
  const user=await use("user");
  if(user){const c=await Promise.resolve(user.can?.("data.write")).catch(()=>null);if(c===false) S.canWrite=false}
  use("assets").then(a=>{S.assets=a;if(S.view==="settings"&&!S._editingPrefs)render()});   // resume upload (owner only)
  const fail=e=>{console.warn(e);if(e&&e.code==="revoked"){S.offline=true;render()}};
  db.collection("jobs").onSnapshot(snap=>{
    const all={};snap.docs.forEach(d=>Object.assign(all,(d.data()||{}).jobs||{}));
    S.jobs=all;S.ready=true;render();
  },fail);
  db.collection("meta").onSnapshot(snap=>{
    snap.docs.forEach(d=>{const x=d.data()||{};if(d.id==="companies")S.companies=x.companies||[];if(d.id==="suggestions")S.suggestions=x.suggestions||[];if(d.id==="eval")S.evalm=x;if(d.id==="company_profiles")S.cprof=x.companies||{};if(d.id==="freshness")S.freshness=x.components||{}});
    render();
  },fail);
  db.collection("triage").onSnapshot(snap=>{const t={};snap.docs.forEach(d=>t[d.id]=d.data());S.triage=t;render()},fail);
  db.doc("settings/prefs").onSnapshot(d=>{S.prefs={...DEFAULT_PREFS,...(d.exists?d.data():{})};render()},fail);
  db.doc("profile/main").onSnapshot(d=>{S.profile=d.exists?d.data():null;render()},fail);
  db.collection("inbox").onSnapshot(snap=>{S.inbox=snap.docs.map(d=>({id:d.id,...d.data()}));render()},fail);
  db.collection("company_decisions").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>m[d.id]=d.data());S.codec=m;render()},fail);
  db.collection("reports").onSnapshot(snap=>{S.reports=snap.docs.map(d=>d.data()).filter(r=>r&&r.date).sort((a,b)=>b.date.localeCompare(a.date));render()},fail);
  db.collection("market_req").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>m[d.id]=d.data());S.mreq=m;render()},fail);
  window.addEventListener("pagehide",()=>lsSet("lastVisit",Date.now()));
}
async function writeTriage(j,patch){
  if(!S.db||!S.canWrite){toast("Open Lodestone signed in as its owner to save triage.");return}
  const prev=tri(j.id)||{};
  const body={...prev,...patch,title:j.title,company:j.company,updated_at:new Date().toISOString()};
  S.triage={...S.triage,[j.id]:body};render();
  try{await S.db.doc("triage/"+j.id).set(body)}catch(e){toast("Couldn't save. Check your connection and try again.");console.warn(e)}
}
function triage(j,status){
  const cur=tri(j.id)||{};
  if(cur.status===status){writeTriage(j,{status:null,stage:cur.stage==="Shortlisted"?null:cur.stage});return}
  const patch={status};
  if(status==="interested"&&!cur.stage) patch.stage="Shortlisted";
  if(status!=="interested"&&cur.stage==="Shortlisted") patch.stage=null;   // auto-shortlisted, so un-shortlist; later stages (Applied…) were set by hand and stay
  if(status==="not"){patch.reasons=cur.reasons||[];S.pendingReasons=j.id}
  else S.pendingReasons=null;
  writeTriage(j,patch);

  }

/* Plain posting text to safe HTML: "## " headings, bullet lines as lists, blank lines as paragraphs. Highlights the
   sentences Lodestone used for years of experience and pay, so you can check them in context. */
function jdHtml(text,marks){
  const hl=x=>{let h=esc(x);for(const m of marks){const q=esc(m).slice(0,140);if(q.length>20&&h.includes(q)) h=h.replace(q,`<mark>${q}</mark>`)}return h};
  return text.split(/\n{2,}/).map(block=>{
    const lines=block.split("\n").map(l=>l.trim()).filter(Boolean); let out="", list=[];
    const flush=()=>{if(list.length){out+=`<ul>${list.map(x=>`<li>${hl(x)}</li>`).join("")}</ul>`;list=[]}};
    for(const l of lines){
      if(l.startsWith("## ")){flush();out+=`<h4>${esc(l.slice(3))}</h4>`}
      else if(/^[-•·*●▪–]\s*/.test(l)) list.push(l.replace(/^[-•·*●▪–]\s*/,""));
      else{flush();out+=`<p>${hl(l)}</p>`}
    }
    flush();return out;
  }).join("");
}

/* Score quality (P1-S5): does the ranking agree with your own triage, and does Lodestone read postings correctly?

function rankingCheck(){
  const live=Object.values(S.jobs).filter(j=>j.live), sc={};live.forEach(j=>{const f=fitScore(j);if(f!=null)sc[j.id]=f});
  const order=Object.keys(sc).sort((a,b)=>sc[b]-sc[a]), rank={};order.forEach((id,i)=>rank[id]=i+1);
  const lab=Object.entries(S.triage).filter(([id,t])=>t&&["interested","later","not"].includes(t.status)&&sc[id]!=null);
  const pos=lab.filter(([,t])=>t.status==="interested").map(([id])=>id), neg=lab.filter(([,t])=>t.status!=="interested").map(([id])=>id);
  let w=0,n=0;pos.forEach(p=>neg.forEach(q=>{n++;w+=sc[p]>sc[q]?1:sc[p]===sc[q]?0.5:0}));
  return {pos:pos.length,neg:neg.length,pairwise:n?w/n:null,top25:pos.filter(id=>rank[id]<=25).length,ranked:order.length,
    misses:pos.filter(id=>rank[id]>25).map(id=>({id,rank:rank[id]})).sort((a,b)=>a.rank-b.rank).slice(0,3)};
}

      <dt>Reading</dt><dd>${acc.length?`Checked against ${rd.postings} hand-checked postings: ${acc.map(([k,v])=>`${NAMES[k]||k} ${pct(v)}`).join(" · ")}.`:"No reading check yet."}</dd>
    </dl>
    ${r.misses.length?`<p class="note">Interested but ranked low: ${r.misses.map(m=>`<button class="link" data-open="${esc(m.id)}">${esc((S.jobs[m.id]||{}).company||"")} #${m.rank}</button>`).join(", ")}</p>`:""}
    <p class="note">${enough?"Enough triage for a reliable read.":`Early read: it gets reliable at 10+ Interested and 10+ Later or Not for me (you have ${r.pos} and ${r.neg}). "Not for me" with a reason helps most.`}</p>
  </section>`;
}
function viewSettings(){
  const p=S.prefs, pr=S.profile||{}, cur=pr.current||{}, pref=pr.preferences||{}, W=p.weights||DEFAULT_PREFS.weights, tot=SUBS.reduce((a,k)=>a+wv(W,k),0), ck={...DEFAULT_PREFS.checks,...(p.checks||{})};
  const val=k=>Array.isArray(pr[k])?pr[k].join("\n"):(pr[k]||"");
  return `<div class="topbar"><h1>Profile</h1><span class="sp"></span>${freshChip()}</div>
  <p class="note">Everything Lodestone knows about you and what you want. Only you can see it. Changes apply straight away to colours and ranking; roles are re-scored against a changed profile at the next daily run.</p>
  <section class="panel"><h4>You</h4>
    ${resumeBlock(pr)}
    <div class="grid2">
      <div class="field"><label for="pf-employer">Current employer</label><input id="pf-employer" value="${esc(cur.employer||"")}" placeholder="e.g. Google"><span class="note">Used to spot internal transfers to its Canadian offices.</span></div>
      <div class="field"><label for="pf-title">Current title</label><input id="pf-title" value="${esc(cur.title||"")}"></div>
      <div class="field"><label for="pf-level">Current level</label><input id="pf-level" value="${esc(cur.level||"")}" placeholder="e.g. L5, Senior PM"></div>
      <div class="field"><label for="pf-where">Where you live now</label><input id="pf-where" value="${esc(pr.location_now||cur.location||"")}"></div>
    </div>
    <div class="field"><label for="pf-work">Work permit</label><select id="pf-work">${Object.entries(WORK_STATUS).map(([k,l])=>`<option value="${k}"${(pr.work_status||"needs_permit")===k?" selected":""}>${esc(l)}</option>`).join("")}</select>
      <span class="note">Lodestone is for people who aren't yet Canadian citizens or permanent residents.</span></div>
    ${PROFILE_FIELDS.map(([k,l,rows])=>`<div class="field"><label for="pf-${k}">${l}</label><textarea id="pf-${k}" rows="${rows}" style="min-height:${rows>1?110:44}px">${esc(val(k))}</textarea></div>`).join("")}
  </section>
  <section class="panel"><h4>What you're looking for</h4>
    <div class="field"><label>Where (green in the colour checks)</label>
      <div class="chips">${REGIONS.filter(r=>r!=="Other Canada").map(r=>`<label class="chip"><input type="checkbox" data-region="${r}"${(p.regions||[]).includes(r)?" checked":""}> ${r}</label>`).join("")}</div>
      <div class="switch"><label for="other">Also show the rest of Canada under "My regions"</label><input type="checkbox" id="other"${p.other_regions?" checked":""}></div></div>
    <div class="field"><label>Role types</label>
      <div class="chips">${TIERS.map(t=>`<label class="chip"><input type="checkbox" data-ptier="${t}"${(p.tiers||[]).includes(t)?" checked":""}> ${t}</label>`).join("")}</div></div>
    <div class="field"><label for="pf-dw">Domains you want</label><textarea id="pf-dw" rows="3">${esc(pref.domains_wanted||"")}</textarea></div>
    <div class="grid2">
      <div class="field"><label for="ck-lg">Target level: green at L (or above)</label><input type="number" id="ck-lg" min="3" max="9" value="${+ck.level_green}"></div>
      <div class="field"><label for="ck-ly">Level: yellow at L</label><input type="number" id="ck-ly" min="3" max="9" value="${+ck.level_yellow}"></div>
      <div class="field"><label for="ck-payg">Pay you want: green from (CA$, top of posted range)</label><input type="number" id="ck-payg" step="5000" value="${+ck.pay_green}"></div>
      <div class="field"><label for="ck-payy">Pay: yellow from (CA$)</label><input type="number" id="ck-payy" step="5000" value="${+ck.pay_yellow}"></div>
    </div>
    <p class="note">Levels use Google's scale as a common reference (L5 Senior, L6 Staff, L7 Principal or Senior Staff).</p>
    <div class="switch"><label for="xpm">Hide roles that manage people</label><input type="checkbox" id="xpm"${p.exclude_people_mgmt?" checked":""}></div>
    <div class="switch"><label for="nopay">Include roles with no Canadian pay range</label><input type="checkbox" id="nopay"${p.include_no_pay?" checked":""}></div>
  </section>
  ${qualityPanel()}
  <section class="panel"><h4>How roles are ranked</h4>
    <p class="note">How much each factor counts in the fit score. They always add up to 100%.</p>
    ${SUBS.map(k=>`<div class="slider"><label for="w-${k}">${SUBLABEL[k]}</label><input type="range" id="w-${k}" min="0" max="60" step="5" value="${wv(W,k)}" data-w="${k}"><span class="mono" id="wv-${k}">${tot?Math.round(wv(W,k)*100/tot):0}%</span></div>`).join("")}
    <div class="row"><button class="btn" data-act="resetw">Reset to defaults</button></div>
  </section>
  <section class="panel"><h4>App</h4>
    <div class="grid2"><div class="field"><label for="dsize">Roles in the digest (1–100)</label><input type="number" id="dsize" min="1" max="100" value="${+p.digest_size||20}"></div>
    <div class="field"><label for="ldays">"Later" roles come back after (days)</label><input type="number" id="ldays" min="1" max="60" value="${+p.later_days||7}"></div>
    <div class="field"><label for="ck-fg">Posted: green within (days)</label><input type="number" id="ck-fg" min="1" max="120" value="${+ck.fresh_green}"></div>
    <div class="field"><label for="ck-fy">Posted: yellow within (days)</label><input type="number" id="ck-fy" min="1" max="365" value="${+ck.fresh_yellow}"></div>
    <div class="field"><label for="maxage">Hide roles posted more than this many days ago (0 shows all)</label><input type="number" id="maxage" min="0" max="365" value="${+p.max_age_days||0}"></div>
    <div class="field"><label for="rdays">Reports archive shows the last (days)</label><input type="number" id="rdays" min="1" max="90" value="${+p.report_days||14}"></div></div>
  </section>
  <div class="row"><button class="btn primary" data-act="saveprefs"${S.offline?" disabled":""}>Save profile</button><span class="note" id="savenote"></span></div>`;
}
function freshPanel(){
  const comps=S.freshness;
  const keys=Object.keys(comps).sort((a,b)=>(a.startsWith("jobs:")-b.startsWith("jobs:"))||a.localeCompare(b));
  const row=k=>{const c=comps[k],ms=parseWhen(c.at),old=!ms||(Date.now()-ms)>7*DAY;
    const name=FRESH_LABEL[k]||(k.startsWith("jobs:")?"Jobs from "+k.slice(5):k);
    const extra=Object.entries(c).filter(([x])=>x!=="at").map(([x,v])=>`${x.replace(/_/g," ")}: ${typeof v==="object"?"…":v}`).join(" · ");
    return `<tr><td>${esc(name)}${extra?`<div class="note">${esc(extra)}</div>`:""}</td><td class="mono">${esc(ago(ms))}</td><td>${old?'<span class="chip warn">Over 7 days</span>':""}</td></tr>`};
  return `<div class="row" style="justify-content:space-between"><h2>Last updated</h2><button class="btn" data-act="close">Close</button></div>
  <p class="note">Lodestone updates every morning at about 7am New York time. Anything older than 7 days is flagged.</p>
  <section class="panel"><table class="tbl"><thead><tr><th>Component</th><th>Updated</th><th></th></tr></thead><tbody>${keys.map(row).join("")||'<tr><td colspan="3">No refresh recorded yet.</td></tr>'}

</tbody></table></section>`;
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-current",b.dataset.view===S.view?"page":"false"));
  const todo=Object.values(S.jobs).filter(j=>matchesBase(j)&&isTodo(j)).length;
  $("#nc-digest").textContent=S.ready&&todo?String(todo):"";
  $("#nc-pipe").textContent=String(Object.values(S.triage).filter(t=>t&&t.stage).length||"");
  const active=document.activeElement, keepId=active&&active.id, caret=active&&active.selectionStart;
  const v={digest:viewDigest,pipeline:viewPipeline,add:viewAdd,reports:viewReports,companies:viewCompanies,settings:viewSettings}[S.view]||viewDigest;
  // keep unsaved settings edits and the paste box while live data re-renders
  if(S.view==="settings"&&document.getElementById("dsize")&&S._editingPrefs) {} else $("#view").innerHTML=v();
  if(keepId){const el=document.getElementById(keepId);if(el&&el!==active){el.focus();try{el.setSelectionRange(caret,caret)}catch{}}}
  const ov=$("#overlay");
  if(S.open==="__fresh") ov.innerHTML=`<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-label="Last updated">${freshPanel()}</aside>`;
  else if(S.open&&S.jobs[S.open]) ov.innerHTML=`<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-label="${esc(S.jobs[S.open].title)}">${viewDetail(S.jobs[S.open])}</aside>`;
  else ov.innerHTML="";
}
function setView(v){S.view=v;S.open=null;S.sel=0;S._editingPrefs=false;lsSet("ui",{view:v,sort:S.sort,region:S.region});render();window.scrollTo(0,0)}
function jobById(id){return S.jobs[id]}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("button,[data-open],a,[data-act]");if(!el) return;
  if(el.tagName==="A") return;
  const d=el.dataset;
  if(d.view){setView(d.view);return}
  if(d.tri){e.stopPropagation();const j=jobById(d.id);if(j)triage(j,d.tri);return}
  if(d.reason){e.stopPropagation();const j=jobById(d.id),t=tri(d.id)||{};const r=new Set(t.reasons||[]);r.has(d.reason)?r.delete(d.reason):r.add(d.reason);if(j)writeTriage(j,{reasons:[...r]});return}
  if(d.show){S.show=d.show;S.sel=0;S.expanded=false;render();return}
  if(d.tier){S.tierOn.has(d.tier)?S.tierOn.delete(d.tier):S.tierOn.add(d.tier);render();return}
  if(d.costatus){S.coStatus=d.costatus;render();return}
  if(d.act==="expand"){S.expanded=true;render();return}
  if(d.act==="fresh"){S.open="__fresh";render();return}
  if(d.act==="close"){S.open=null;render();return}
  if(d.act==="addjob"){addJob();return}
  if(d.sug){e.stopPropagation();decideCompany(d.key,d.sug);return}
  if(d.act==="suguall"){S.sugAll=true;render();return}
  if(d.dtab){S.dtab=d.dtab;lsSet("dtab",d.dtab);render();const tb=document.getElementById("dt-"+d.dtab);if(tb)tb.focus();return}
  if(d.cofilter){S.view="digest";S.q=d.cofilter;S.show="all";S.region="all";S.open=null;S.sel=0;render();window.scrollTo(0,0);return}
  if(d.act==="mreq"){e.stopPropagation();const j=jobById(d.id);if(j)requestMarket(j);return}
  if(d.act==="saveprefs"){savePrefs();return}
  if(d.act==="resetw"){SUBS.forEach(k=>{const i=document.getElementById("w-"+k);if(i)i.value=DEFAULT_PREFS.weights[k]});updateWeightLabels();S._editingPrefs=true;return}
  if(d.open!==undefined&&!e.target.closest(".triage,.reasons,a,select")){S.open=d.open;if(d.idx)S.sel=+d.idx;render()}
});
document.addEventListener("keydown",e=>{   // arrow keys move between detail tabs (ARIA tabs pattern)
  const t=e.target; if(!t||t.getAttribute("role")!=="tab"||!["ArrowLeft","ArrowRight","Home","End"].includes(e.key)) return;
  e.preventDefault(); e.stopPropagation();
  const i=DTABS.findIndex(([k])=>k===t.dataset.dtab), n=e.key==="Home"?0:e.key==="End"?DTABS.length-1:(i+(e.key==="ArrowRight"?1:-1)+DTABS.length)%DTABS.length;
  S.dtab=DTABS[n][0];lsSet("dtab",S.dtab);render();const tb=document.getElementById("dt-"+S.dtab);if(tb)tb.focus();
},true);
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){S.q=t.value;S.sel=0;render()}
  else if(t.id==="coq"){S.coQ=t.value;render()}
  else if(t.dataset.w){updateWeightLabels();S._editingPrefs=true}
  else if(S.view==="settings") S._editingPrefs=true;
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="region"){S.region=t.value;S.sel=0;lsSet("ui",{view:S.view,sort:S.sort,region:S.region});render()}
  else if(t.id==="sort"){S.sort=t.value;lsSet("ui",{view:S.view,sort:S.sort,region:S.region});render()}
  else if(t.id==="stage"){const j=jobById(t.dataset.id);if(j)writeTriage(j,{stage:t.value||null,...(t.value&&!tri(j.id)?.status?{status:"interested"}:{})})}
  else if(t.dataset.move!==undefined){const id=t.dataset.move,j=jobById(id),cur=tri(id)||{};
    const body={...cur,stage:t.value||null,updated_at:new Date().toISOString()};S.triage={...S.triage,[id]:body};render();
    if(S.db) S.db.doc("triage/"+id).set(body).catch(()=>toast("Couldn't save. Try again."));}
  else if(t.id==="cvfile"){uploadResume(t.files&&t.files[0]);t.value=""}
  else if(t.id==="notes"){const j=jobById(t.dataset.id);if(j&&(tri(j.id)||{}).notes!==t.value)writeTriage(j,{notes:t.value})}
});
function updateWeightLabels(){const v={};SUBS.forEach(k=>v[k]=+(document.getElementById("w-"+k)||{}).value||0);const tot=SUBS.reduce((a,k)=>a+v[k],0);SUBS.forEach(k=>{const s=document.getElementById("wv-"+k);if(s)s.textContent=(tot?Math.round(v[k]*100/tot):0)+"%"})}
async function savePrefs(){
  if(!S.db){toast("Your profile saves inside claude.ai only.");return}
  const val=id=>document.getElementById(id);
  const regions=[...document.querySelectorAll("[data-region]")].filter(i=>i.checked).map(i=>i.dataset.region);
  const tiers=[...document.querySelectorAll("[data-ptier]")].filter(i=>i.checked).map(i=>i.dataset.ptier);
  const raw={};SUBS.forEach(k=>raw[k]=+val("w-"+k).value||0);const tot=SUBS.reduce((a,k)=>a+raw[k],0)||1;
  const weights={};SUBS.forEach(k=>weights[k]=Math.round(raw[k]*100/tot));
  const clamp=(x,a,b,d)=>{x=Math.round(+x);return isFinite(x)?Math.min(b,Math.max(a,x)):d};
  const body={regions,tiers:tiers.length?tiers:TIERS,other_regions:val("other").checked,exclude_people_mgmt:val("xpm").checked,
    include_no_pay:val("nopay").checked,digest_size:clamp(val("dsize").value,1,100,20),later_days:clamp(val("ldays").value,1,60,7),report_days:clamp(val("rdays").value,1,90,14),
    checks:{green_regions:regions,pay_green:clamp(val("ck-payg").value,50000,600000,190000),pay_yellow:clamp(val("ck-payy").value,30000,600000,160000),
      level_green:clamp(val("ck-lg").value,3,9,6),level_yellow:clamp(val("ck-ly").value,3,9,5),fresh_green:clamp(val("ck-fg").value,1,120,14),fresh_yellow:clamp(val("ck-fy").value,1,365,30)},max_age_days:clamp(val("maxage").value,0,365,0),weights,updated_at:new Date().toISOString()};
  const prof={...(S.profile||{version:0})};
  prof.current={...(prof.current||{}),employer:val("pf-employer").value.trim(),title:val("pf-title").value.trim(),level:val("pf-level").value.trim()};
  prof.location_now=val("pf-where").value.trim();prof.work_status=val("pf-work").value;
  PROFILE_FIELDS.forEach(([k])=>{const v=val("pf-"+k).value.trim();prof[k]=Array.isArray((S.profile||{})[k])||k!=="headline"&&k!=="summary"?v.split("\n").map(x=>x.trim()).filter(Boolean):v});
  prof.preferences={...(prof.preferences||{}),domains_wanted:val("pf-dw").value.trim()};
  const cv=val("cvtext"); if(cv&&cv.value.trim()&&cv.value.trim()!==((prof.resume||{}).text||"")) prof.resume={...(prof.resume||{}),text:cv.value.trim().slice(0,40000),uploaded_at:new Date().toISOString(),status:"uploaded"};
  prof.version=(+prof.version||0)+1;prof.edited_at=new Date().toISOString();
  try{await S.db.doc("settings/prefs").set(body);await S.db.doc("profile/main").set(prof);S._editingPrefs=false;S.prefs={...DEFAULT_PREFS,...body};render();toast("Profile saved.")}
  catch(e){toast("Couldn't save your profile. Try again.");console.warn(e)}
}
async function addJob(){
  const box=document.getElementById("paste");const text=(box&&box.value||"").trim();
  if(!text){toast("Paste a link or a job description first.");return}
  if(!S.db){toast("Adding jobs works inside claude.ai only.");return}
  try{await S.db.collection("inbox").add({text:text.slice(0,20000),created_at:new Date().toISOString(),status:"new"});box.value="";toast("Added. It's processed at your next refresh.")}
  catch(e){toast(e&&e.code==="quota_exceeded"?"The inbox is full. Run a refresh to clear it.":"Couldn't add it. Try again.");console.warn(e)}
}
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea,select")) return;
  if(e.key==="Escape"&&S.open){S.open=null;render();return}
  if(S.view!=="digest"||S.open&&e.key!=="Escape") return;
  const list=S._order||[];if(!list.length) return;
  const k=e.key.toLowerCase();
  if(k==="j"||k==="k"){S.sel=Math.max(0,Math.min(list.length-1,S.sel+(k==="j"?1:-1)));render();document.querySelector(".card.sel")?.scrollIntoView({block:"nearest"});e.preventDefault()}
  else if(k==="enter"){S.open=list[S.sel].id;render()}
  else if(k==="i"||k==="l"||k==="n"){triage(list[S.sel],{i:"interested",l:"later",n:"not"}[k])}
});
document.addEventListener("paste",e=>{
  if(e.target.closest("input,textarea")) return;
  const txt=(e.clipboardData||window.clipboardData)?.getData("text");if(!txt) return;
  setView("add");setTimeout(()=>{const b=document.getElementById("paste");if(b){b.value=txt;b.focus()}},0);
});
boot();
</script>
