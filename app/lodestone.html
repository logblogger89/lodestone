<style>
/* Layout: app shell. Left rail on wide screens, bottom tab bar on iPad/phone; content column max 1100px.
   Tokens follow the M2 prototype ("magnetite and survey map"). */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --surface-2:#e9edef; --line:#d5dce0;
  --fg:#16202a; --muted:#5b6873; --accent:#24507a; --accent-fg:#ffffff; --accent-soft:#dbe6f0;
  --good:#1f7a4d; --good-soft:#dcefe4; --warn:#9a6200; --warn-soft:#f5e8cf; --unk:#6b6f78; --unk-soft:#e6e7ea; --bad:#a3342c; --bad-soft:#f4dedc;
  --scrim:rgba(10,16,22,.45);
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#16202a; --surface-2:#1d2935; --line:#2b3a47;
  --fg:#e6ecf0; --muted:#9aa8b3; --accent:#7fb0e0; --accent-fg:#0b1620; --accent-soft:#1d3247;
  --good:#6fcf9b; --good-soft:#173528; --warn:#e6b45c; --warn-soft:#3a2d12; --unk:#a7acb5; --unk-soft:#262b33; --bad:#ec8a80; --bad-soft:#3b1d1a;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#16202a; --surface-2:#1d2935; --line:#2b3a47;
  --fg:#e6ecf0; --muted:#9aa8b3; --accent:#7fb0e0; --accent-fg:#0b1620; --accent-soft:#1d3247;
  --good:#6fcf9b; --good-soft:#173528; --warn:#e6b45c; --warn-soft:#3a2d12; --unk:#a7acb5; --unk-soft:#262b33; --bad:#ec8a80; --bad-soft:#3b1d1a;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin:0 6px 14px}
.brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;color:var(--muted);min-height:44px}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.nav .count{margin-left:auto;font-family:var(--font-mono);font-size:12px}
.main{min-width:0;padding-block:18px 96px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar h1{font-family:var(--font-display);font-size:26px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.topbar .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.fresh{font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:32px}
.fresh .dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.fresh.stale .dot{background:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--fg);border:1px solid transparent;white-space:nowrap}
.chip.t-core{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.t-adjacent{background:var(--good-soft);color:var(--good)}
.chip.t-stretch{background:var(--unk-soft);color:var(--unk)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad);font-weight:600}
.toggle{cursor:pointer;border-color:var(--line);background:var(--surface);min-height:30px}
.toggle[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input[type=search]{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;min-height:40px}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;min-height:40px}
.summary{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:baseline;color:var(--muted);font-size:14px}
.summary strong{color:var(--fg);font-family:var(--font-display);font-size:18px}
.list{display:flex;flex-direction:column;gap:10px}
.section-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 2px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:start;cursor:pointer}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.done{opacity:.6}
.card h3{margin:0;font-size:16px;font-weight:600;line-height:1.3}
.co{color:var(--fg);font-weight:500}
.meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px;margin:2px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.pay{font-family:var(--font-mono);font-size:13px;font-weight:500}
.pay small{font-family:var(--font-body);font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}
.pay.us{font-weight:400;color:var(--muted)}
.paymore{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.nopay{font-size:12px;color:var(--muted)}
.payrows{display:flex;flex-direction:column;gap:2px}
.payrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:8px 10px;border-radius:8px;font-size:13px}
.payrow .lbl{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.payrow .amt{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.payrow.main{background:var(--accent-soft)}
.payrow.main .lbl{color:var(--fg);font-weight:600}
.payrow.main .amt{font-size:16px;font-weight:600;color:var(--fg)}
.payhead{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 10px 0}
details.quotes summary{cursor:pointer;font-size:12px;color:var(--muted)}
.kind{font-family:var(--font-body);font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:1px 5px;margin-left:6px}
.payrow .sub{display:block;font-size:11px;color:var(--muted);font-weight:400}
.payrow.eq{border-top:1px dashed var(--line);border-radius:0;margin-top:4px}
.src-line{font-size:12px;color:var(--muted);margin:4px 0 0}
mark{background:var(--accent-soft);color:var(--fg);border-radius:3px;padding:0 2px}
mark.w{background:var(--warn-soft)}
details.quotes blockquote{margin:6px 0 0;padding:6px 10px;border-left:2px solid var(--line);font-size:12px;color:var(--muted)}
.srcs{display:inline-flex;gap:4px;flex-wrap:wrap}
a.src{font-size:11px;font-weight:600;font-family:var(--font-mono);text-decoration:none;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:2px 6px;white-space:nowrap}
a.src:hover{border-color:var(--accent);color:var(--accent)}
.compass{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;text-align:center;font-size:10px;line-height:1.1;color:var(--muted);position:relative}
.compass b{display:block;font-family:var(--font-display);font-size:15px;color:var(--fg)}
.compass.core{border-color:var(--accent)} .compass.core b{color:var(--accent)}
.compass.adjacent{border-color:var(--good)} .compass.adjacent b{color:var(--good)}
.ring{position:relative;width:56px;height:56px}
.ring svg{width:56px;height:56px;display:block}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-mono);font-weight:500;font-size:16px;color:var(--fg)}
.ring .trk{stroke:var(--surface-2)} .ring .arc{stroke:var(--accent)} .ring .ndl{fill:var(--accent)}
.stale{color:var(--warn);font-weight:600}
.chip.s-stated{background:var(--good-soft);color:var(--good)}
.chip.s-inferred{background:var(--warn-soft);color:var(--warn)}
.chip.s-unknown{background:var(--unk-soft);color:var(--unk)}
.chip.s-none{background:var(--bad-soft);color:var(--bad)}
.fitsum{font-size:13px;color:var(--muted);margin:-4px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{display:grid;grid-template-columns:76px minmax(0,1fr) 34px;gap:4px 10px;align-items:center;font-size:13px}
.bar .track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent)}
.bar .why{grid-column:2 / 4;color:var(--muted);font-size:12px;margin-bottom:4px}
.bar .w{font-size:11px;color:var(--muted)}
.overall{display:flex;align-items:center;gap:14px}
.overall p{margin:0;font-size:14px}
.triage{display:flex;flex-direction:column;gap:6px}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:100px;min-height:36px;cursor:pointer;font-size:13px}
.tbtn.on-interested{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.tbtn.on-later{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:600}
.tbtn.on-not{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.reasons button{font-size:12px;border:1px dashed var(--line);background:none;border-radius:999px;padding:4px 10px;cursor:pointer;min-height:30px}
.reasons button[aria-pressed="true"]{border-style:solid;border-color:var(--bad);color:var(--bad)}
.more{align-self:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h2{font-family:var(--font-display);font-size:20px;margin:0;color:var(--fg)}
/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:21;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:14px}
.drawer h2{font-family:var(--font-display);font-size:22px;margin:0;text-wrap:balance}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h4{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:14px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap}
.tblwrap{overflow-x:auto}
.note{font-size:12px;color:var(--muted)}
.soon{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px}
/* pipeline */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.col h4{margin:0 2px 2px;font-size:13px;display:flex;justify-content:space-between}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.pcard button.link{border:0;background:none;padding:0;text-align:left;cursor:pointer;font-weight:600;color:var(--fg)}
.pcard select,.field select{font-size:13px;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.flag{font-size:11px;font-weight:600;color:var(--bad)}
/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500}
textarea,input[type=text],input[type=number]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;width:100%}
textarea{min-height:110px;resize:vertical;font-family:var(--font-mono);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch input{width:20px;height:20px;flex:none}
.slider{display:grid;grid-template-columns:80px minmax(0,1fr) 48px;gap:10px;align-items:center}
.tip{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14px}
kbd{font-family:var(--font-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
.toast{max-width:calc(100% - 32px);word-break:break-word;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30}
.tabbar{display:none}
@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:15}
  .tabbar button{border:0;background:none;min-height:48px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
  .tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}
}
@media (max-width: 560px){
  .card{grid-template-columns:48px minmax(0,1fr);gap:10px}
  .compass{width:46px;height:46px} .compass b{font-size:13px}
  .triage{grid-column:1 / -1;flex-direction:row}
  .tbtn{flex:1;min-width:0}
  .topbar h1{font-size:22px}
  .facts{grid-template-columns:100px minmax(0,1fr)}
}
@media (prefers-reduced-motion: no-preference){.card{transition:border-color .15s}}
</style>

<script>
"use strict";
/* ---------- constants (defaults mirror PRD/UX decisions; real values live in settings/prefs) ---------- */
const STAGES = ["Shortlisted","Applied","Screen","Interviewing","Offer","Closed"];
const TIERS = ["Core","Adjacent","Stretch"];
const TIER_HELP = {Core:"Core PM role", Adjacent:"Adjacent role (TPM, program, strategy & ops, chief of staff, trust & safety)", Stretch:"Stretch role (product marketing, solutions, analytics)"};
const REGIONS = ["GTA","Waterloo Region","Remote-Canada","Ottawa","Montreal","Vancouver","Calgary","Edmonton","Other Canada"];
const SUBS = ["role","level","domain","pathway","pay","skills","freshness"];
const SUBLABEL = {role:"Role",level:"Level",domain:"Domain",pathway:"Pathway",pay:"Pay",skills:"Skills",freshness:"Freshness"};
/* A weight saved before a factor existed falls back to its default (so freshness counts for older settings). */
const wv=(W,k)=>+(W&&W[k]!=null?W[k]:DEFAULT_PREFS_W[k])||0;
const NOT_REASONS = ["Level too junior","Not my domain","Location","People management","Pay too low","Company"];
const DEFAULT_PREFS = {
  regions:["GTA","Waterloo Region","Remote-Canada"], other_regions:true, tiers:["Core","Adjacent","Stretch"],
  exclude_people_mgmt:true, include_no_pay:true, digest_size:20, later_days:7, max_age_days:0,
  weights:{role:22,level:18,domain:18,pathway:14,pay:9,skills:9,freshness:10}
};
const DEFAULT_PREFS_W = DEFAULT_PREFS.weights;
/* Freshness (computed here, so it changes daily without re-scoring): older postings are more likely filled.
   Uses the posting date; when a site gives none, the day Lodestone first saw the role, capped lower because
   the role may be older than that. */
function freshness(j){
  const posted=parseWhen(j.posted_at), seen=parseWhen(j.first_seen), ms=posted??seen;
  if(ms==null) return {score:50,days:null,why:"Posting date unknown"};
  const d=Math.max(0,Math.round((Date.now()-ms)/DAY));
  let v=d<=14?100:d<=30?85:d<=45?60:d<=60?30:d<=90?15:5;
  if(posted==null) v=Math.min(v,70);
  const why=posted!=null?(d<=14?`Posted ${d} day${d===1?"":"s"} ago`:`Posted ${d} days ago; older roles are more often filled`)
    :`No posting date; first seen by Lodestone ${d} day${d===1?"":"s"} ago`;
  return {score:v,days:d,why,dated:posted!=null};
}
const FRESH_LABEL = {jobs:"Job pulls (all sources)", source_index:"Source index", ats_detection:"Job-board detection",
  scoring:"Fit scoring", signals:"Pathway signals (ESDC)", discovery:"Company discovery", profile:"Your profile"};

/* ---------- state ---------- */
const S = {
  db:null, ready:false, offline:false, canWrite:true,
  jobs:{}, triage:{}, prefs:{...DEFAULT_PREFS}, companies:[], freshness:{}, inbox:[],
  view:"digest", open:null, sel:0, show:"todo", region:"preferred", q:"", tierOn:new Set(TIERS), sort:"best",
  coQ:"", coStatus:"all", expanded:false, lastVisit:null, pendingReasons:null
};
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u||"") ? u : "#";
function lsGet(k,d){try{const v=localStorage.getItem("lodestone:"+k);return v==null?d:JSON.parse(v)}catch{return d}}
function lsSet(k,v){try{localStorage.setItem("lodestone:"+k,JSON.stringify(v))}catch{}}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,4200)}

/* ---------- dates ---------- */
const DAY=864e5;
function parseWhen(v){
  if(v==null||v==="") return null;
  if(typeof v==="number") return v>1e12?v:v*1000;
  const s=String(v).trim();
  if(/^\d{9,13}$/.test(s)){const n=+s;return n>1e12?n:n*1000}
  let m=s.match(/posted\s+(today|yesterday|(\d+)\+?\s+days?\s+ago)/i);
  if(m){const d=/today/i.test(m[1])?0:/yesterday/i.test(m[1])?1:+m[2];return Date.now()-d*DAY}

const postedMs = j => parseWhen(j.posted_at) ?? parseWhen(j.first_seen);

/* ---------- formatting ---------- */
function fmtK(n){n=+n;if(!isFinite(n)) return "";if(n<1000) return n%1?n.toFixed(2):String(n);const k=n/1000;return (k%1?k.toFixed(1).replace(/\.0$/,""):String(k))+"K"}
/* One range as posted (never converted, B8): CA$126K–176K, US$137.9K–256.1K, $45–55/hr. */
function rangeText(r){
  if(!r||(!r.min&&!r.max)) return "";
  const cur=(r.currency||"").toUpperCase(), sym=cur==="USD"?"US$":cur==="CAD"?"CA$":cur?cur+" ":"$";
  const per=r.interval==="hour"?"/hr":r.interval==="month"?"/mo":"";
  const lo=r.min?fmtK(r.min):"", hi=r.max?fmtK(r.max):"";
  return sym+(lo&&hi&&lo!==hi?lo+"–"+hi:(lo||hi))+per;

/* Pay object from refresh: {ranges:[...], primary: index|null, source, equity}. Older shape {min,max,...} is wrapped. */
function payInfo(j){
  let p=j.pay; if(p&&!p.ranges&&(p.min||p.max)) p={ranges:[p],primary:0,source:"field"};
  const ranges=(p&&p.ranges)||[]; const main=p&&p.primary!=null?ranges[p.primary]:null;
  return {ranges,main,others:ranges.filter(r=>r!==main),source:p&&p.source,equity:p&&p.equity,

const payText=j=>{const pi=payInfo(j);return pi.main?rangeText(pi.main):""};
function shortLabel(l){return String(l||"").replace(/,?\s*Canada$/i,"").replace(/^Canada\s*-\s*/i,"").trim()}
/* What a range covers, in the posting's own terms. Base is the norm, so only other kinds get a card tag. */
const KIND={base:"Base salary",base_bonus:"Base + bonus",ote:"On-target earnings (incl. commission)",total:"Total compensation",unspecified:"Pay type not stated"};
const KIND_TAG={base_bonus:"incl. bonus",ote:"OTE",total:"total comp"};

  if(!e||!e.offered) return "";

/* Card: the Canadian range, its place, a tag when it isn't base pay, and quiet notes for other regions and equity. */
function payCard(j){

  if(pi.main){
    const lbl=shortLabel(pi.main.label), more=pi.others.length, tag=KIND_TAG[pi.main.kind];
    const usN=pi.others.filter(r=>r.canada===false||r.currency==="USD").length;
    const tip=[KIND[pi.main.kind||"unspecified"],pi.main.estimated?"employer's estimate":"",pi.main.currency?"":"currency not stated"].filter(Boolean).join(" · ");
    return `<span class="pay" title="${esc(tip)}">${esc(rangeText(pi.main))}${tag?`<span class="kind">${esc(tag)}</span>`:""}${lbl&&lbl.toLowerCase()!=="canada"?`<small>${esc(lbl)}</small>`:""}</span>${more?`<span class="paymore" title="This posting lists ${more} more range${more>1?"s":""}. Open the role to see them.">+${more} ${usN===more?"US":"more"}</span>`:""}${eqTag}`;
  }
  if(pi.ranges.length) return `<span class="pay us" title="The posting lists pay for other countries only">${esc(rangeText(pi.ranges[0]))}<small>US range only</small></span>${eqTag}`;
  return (pi.checked?`<span class="nopay">No pay in posting</span>`:`<span class="nopay">Pay not checked yet</span>`)+eqTag;
}
/* Highlight the numbers and the words that say what they cover, inside the quoted sentence. */
function markQuote(q){
  return esc(q).replace(/((?:US|CA|C)?\$\s?\d[\d,]*(?:\.\d\d)?(?:\s?[kK]\b)?|\b\d{1,3}(?:,\d{3})+(?:\.\d\d)?(?:\s?(?:\$\s?)?(?:CAD|USD))?|\b\d+(?:\.\d+)?\s?%)/g,"<mark>$1</mark>")
    .replace(/\b(base (?:salary|pay|compensation)|inclusive of[^,.;]{0,40}bonus|including[^,.;]{0,30}(?:bonus|commission)|on[- ]target earnings|OTE|total (?:cash|compensation)|bonus|commission|equity|stock options?|RSUs?|estimated|expected)\b/gi,"<mark class=\"w\">$1</mark>");
}
function fmtDate(v){const ms=parseWhen(v);return ms?new Date(ms).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):""}
function sourceLine(j,pi){
  const s0=(j.sources||[])[0]; if(!s0) return "";

  const what=pi.source==="field"?`${esc(j.company)}'s salary data in ${esc(s0.label)} (structured field, not the posting text)`:`${esc(j.company)}'s posting on ${esc(s0.label)}`;
  return `<p class="src-line"><b>Source:</b> ${what}${read?` · read ${esc(read)}`:""} · <a href="${esc(safeUrl(s0.url))}" target="_blank" rel="noopener">Open posting ↗</a></p>`;
}
/* Detail: Canadian range highlighted, every other range below, equity, and exactly where it all came from. */
function payPanel(j){

  if(!pi.ranges.length) body=pi.checked?`<p class="nopay">The posting doesn't state a pay range. Estimates arrive in Sprint 4.</p>`:`<p class="nopay">Lodestone hasn't read the full posting yet. Open it to check pay.</p>`;
  else body=`<div class="payrows">${pi.main?row(pi.main,true):`<p class="nopay">No Canadian range in this posting.</p>`}
      ${pi.others.length?`<div class="payhead">Other ranges in this posting</div>${pi.others.map(r=>row(r,false)).join("")}`:""}</div>`;
  const eq=pi.equity&&pi.equity.offered?`<div class="payrow eq"><span class="lbl">Equity<span class="sub">${pi.equity.certainty==="possible"?"Posting says the role may be eligible":"Posting says equity is part of the offer"}</span></span><span class="amt">${esc(equityText(pi.equity))}</span></div>`:"";
  const quotes=[...new Set([...pi.ranges.map(r=>r.quote),pi.equity&&pi.equity.quote].filter(Boolean))];
  const evidence=(pi.ranges.length||eq)?`${sourceLine(j,pi)}${quotes.length?`<details class="quotes"><summary>Show the exact wording</summary>${quotes.map(q=>`<blockquote>“${markQuote(q)}”</blockquote>`).join("")}</details>`:""}`:"";

}
/* Pay sort: base (or unlabelled) ranges compete with each other; bonus-inclusive, OTE and total-comp ranges rank after them. */
const payMax=j=>{const m=payInfo(j).main;if(!m) return -1;const v=(m.interval==="hour"?m.max*2000:m.max)||0;return (["base","unspecified",undefined].includes(m.kind)?1e9:0)+v};
function where(j){return j.location||j.region||"Canada"}

/* ---------- derived ---------- */
function tri(id){return S.triage[id]||null}
function laterDue(t){return t&&t.status==="later"&&(Date.now()-(parseWhen(t.updated_at)||0))>(S.prefs.later_days||7)*DAY}
function inPreferred(j){
  const r=S.prefs.regions||[];
  return r.includes(j.region)||(S.prefs.other_regions&&!["GTA","Waterloo Region","Remote-Canada"].includes(j.region));
}
function matchesBase(j){
  if(!j.live) return false;
  if(!S.tierOn.has(j.tier)) return false;
  if(!(S.prefs.tiers||TIERS).includes(j.tier)) return false;
  if(S.prefs.exclude_people_mgmt&&managesPeople(j)) return false;
  if(+S.prefs.max_age_days>0){const fr=freshness(j);if(fr.dated&&fr.days>+S.prefs.max_age_days) return false}
  if(!S.prefs.include_no_pay&&!payText(j)) return false;
  if(S.region==="preferred"){if(!inPreferred(j)) return false}
  else if(S.region!=="all"&&j.region!==S.region) return false;
  if(S.q){const q=S.q.toLowerCase();if(!(j.title+" "+j.company+" "+j.location+" "+(j.department||"")).toLowerCase().includes(q)) return false}
  return true;
}
const isTodo=j=>{const t=tri(j.id);return !t||!t.status||laterDue(t)};
function matches(j){
  if(!matchesBase(j)) return false;
  const t=tri(j.id);
  if(S.show==="todo") return isTodo(j);

const TIER_RANK={Core:0,Adjacent:1,Stretch:2};
const PREF_RANK=r=>{const i=(S.prefs.regions||[]).indexOf(r);return i<0?9:i};
function sorted(list){
  const by={
    best:(a,b)=>((fitScore(b)??-1)-(fitScore(a)??-1))||TIER_RANK[a.tier]-TIER_RANK[b.tier]||PREF_RANK(a.region)-PREF_RANK(b.region)||(postedMs(b)||0)-(postedMs(a)||0),
    newest:(a,b)=>(postedMs(b)||0)-(postedMs(a)||0),

function visible(){return sorted(Object.values(S.jobs).filter(matches))}
const isNew=j=>S.lastVisit&&parseWhen(j.first_seen)>S.lastVisit;

/* ---------- db ---------- */
async function boot(){
  S.lastVisit=lsGet("lastVisit",null);
  try{ const v=lsGet("ui",{}); if(v.view) S.view=v.view; if(v.sort) S.sort=v.sort; if(v.region) S.region=v.region }catch{}
  render();
  const use=n=>{try{return Promise.resolve(window.claude?.use?.(n)??null).catch(()=>null)}catch{return Promise.resolve(null)}};
  const db=await use("db");
  if(!db){S.offline=true;render();return}
  S.db=db;
  const user=await use("user");
  if(user){const c=await Promise.resolve(user.can?.("data.write")).catch(()=>null);if(c===false) S.canWrite=false}
  const fail=e=>{console.warn(e);if(e&&e.code==="revoked"){S.offline=true;render()}};
  db.collection("jobs").onSnapshot(snap=>{
    const all={};snap.docs.forEach(d=>Object.assign(all,(d.data()||{}).jobs||{}));
    S.jobs=all;S.ready=true;render();
  },fail);
  db.collection("meta").onSnapshot(snap=>{
    snap.docs.forEach(d=>{const x=d.data()||{};if(d.id==="companies")S.companies=x.companies||[];if(d.id==="freshness")S.freshness=x.components||{}});
    render();
  },fail);
  db.collection("triage").onSnapshot(snap=>{const t={};snap.docs.forEach(d=>t[d.id]=d.data());S.triage=t;render()},fail);
  db.doc("settings/prefs").onSnapshot(d=>{S.prefs={...DEFAULT_PREFS,...(d.exists?d.data():{})};render()},fail);
  db.doc("profile/main").onSnapshot(d=>{S.profile=d.exists?d.data():null;render()},fail);
  db.collection("inbox").onSnapshot(snap=>{S.inbox=snap.docs.map(d=>({id:d.id,...d.data()}));render()},fail);
  window.addEventListener("pagehide",()=>lsSet("lastVisit",Date.now()));
}
async function writeTriage(j,patch){
  if(!S.db||!S.canWrite){toast("Open Lodestone signed in as its owner to save triage.");return}
  const prev=tri(j.id)||{};
  const body={...prev,...patch,title:j.title,company:j.company,updated_at:new Date().toISOString()};
  S.triage={...S.triage,[j.id]:body};render();
  try{await S.db.doc("triage/"+j.id).set(body)}catch(e){toast("Couldn't save. Check your connection and try again.");console.warn(e)}
}
function triage(j,status){
  const cur=tri(j.id)||{};
  if(cur.status===status){writeTriage(j,{status:null,stage:cur.stage==="Shortlisted"?null:cur.stage});return}
  const patch={status};
  if(status==="interested"&&!cur.stage) patch.stage="Shortlisted";
  if(status==="not"){patch.reasons=cur.reasons||[];S.pendingReasons=j.id}
  else S.pendingReasons=null;
  writeTriage(j,patch);
  toast(status==="interested"?"Added to your pipeline (Shortlisted).":status==="later"?`Back in your digest in ${S.prefs.later_days||7} days.`:"Hidden. Tap a reason below if you like.");
}

/* ---------- views ---------- */
function freshChip(){
  const j=S.freshness.jobs; const ms=parseWhen(j&&j.at);
  const stale=!ms||(Date.now()-ms)>7*DAY;
  return `<button class="fresh${stale?" stale":""}" data-act="fresh" aria-label="When data was last updated"><span class="dot" aria-hidden="true"></span>${ms?"Jobs updated "+ago(ms):"Not refreshed yet"}</button>`;
}
/* Overall fit: the six sub-scores blended with the weights from Settings (computed here, so changing weights re-ranks instantly). */
function fitScore(j){
  if(!j.fit||!j.fit.subs) return null;
  const W=S.prefs.weights||DEFAULT_PREFS.weights; let t=0,sum=0;
  SUBS.forEach(k=>{const w=wv(W,k);t+=w;sum+=w*subVal(j,k)});
  return t?Math.round(sum/t):null;
}
/* Sub-score for one factor: freshness and pathway come from data the app holds (daily date math; ESDC and

function subVal(j,k){
  if(k==="freshness") return freshness(j).score;

  return +((j.fit&&j.fit.subs)||{})[k]||0;
}
function pathwayWhy(j){const g=(j.pathway&&j.pathway.signals)||[];return g.length?g.map(x=>`${x.label} (${x.status.toLowerCase()})`).join("; "):""}

function pathwayChips(j){

    const bad=x.label.startsWith("Posting limits");
    const short=x.label==="Intra-company transfer"?"Internal transfer":x.label.startsWith("Hires from abroad")?"Hires from abroad":bad?"No sponsorship":"Sponsorship offered";
    return `<span class="chip ${bad?"s-none":SIG_CLASS[x.status]||""}" title="${esc(x.detail||"")}">${esc(short)} · ${esc(x.status)}</span>`;}).join("");
}
const managesPeople=j=>j.fit?!!j.fit.people_mgmt:!!j.people_mgmt;
/* Compass ring: the arc fills with the score and the needle points to true north at 100. */
function ring(v,size){
  const r=24,c=2*Math.PI*r,off=c*(1-v/100),a=(v/100)*360-90,rad=a*Math.PI/180,nx=28+24*Math.cos(rad),ny=28+24*Math.sin(rad);
  return `<div class="ring" title="Fit ${v} of 100"><svg viewBox="0 0 56 56" aria-hidden="true"><circle class="trk" cx="28" cy="28" r="${r}" fill="none" stroke-width="5"/><circle class="arc" cx="28" cy="28" r="${r}" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 28 28)"/><circle class="ndl" cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="3.2"/></svg><span class="val">${v}</span></div>`;
}
function staleTag(j){
  const fr=freshness(j); if(fr.days==null) return "";

function card(j,i){

function viewDigest(){

    ${TIERS.map(t=>`<button class="chip toggle" data-tier="${t}" aria-pressed="${S.tierOn.has(t)}" title="${esc(TIER_HELP[t])}">${t}</button>`).join("")}
  </div>
  ${body}
  <p class="note">"Best match" ranks by fit score (your weights in Settings), then role tier and region for anything not scored yet. Keyboard: <kbd>J</kbd>/<kbd>K</kbd> move, <kbd>I</kbd>/<kbd>L</kbd>/<kbd>N</kbd> triage, <kbd>Enter</kbd> opens.</p>`;

function offlineState(){return `<div class="empty"><h2>Open Lodestone on claude.ai to see your jobs</h2><p>Your jobs and triage live in this page's private database, which only loads inside claude.ai while you're signed in.</p></div>`}
/* Pathway signals (R10): each with its status and a link to the evidence. Signals, not immigration advice. */
function pathwayPanel(j){
  const g=(j.pathway&&j.pathway.signals)||[];

document.addEventListener("click",e=>{

  if(d.view){setView(d.view);return}

  if(d.reason){e.stopPropagation();const j=jobById(d.id),t=tri(d.id)||{};const r=new Set(t.reasons||[]);r.has(d.reason)?r.delete(d.reason):r.add(d.reason);if(j)writeTriage(j,{reasons:[...r]});return}
  if(d.show){S.show=d.show;S.sel=0;S.expanded=false;render();return}
  if(d.tier){S.tierOn.has(d.tier)?S.tierOn.delete(d.tier):S.tierOn.add(d.tier);render();return}
  if(d.costatus){S.coStatus=d.costatus;render();return}

});

function updateWeightLabels(){const v={};SUBS.forEach(k=>v[k]=+(document.getElementById("w-"+k)||{}).value||0);const tot=SUBS.reduce((a,k)=>a+v[k],0);SUBS.forEach(k=>{const s=document.getElementById("wv-"+k);if(s)s.textContent=(tot?Math.round(v[k]*100/tot):0)+"%"})}
async function savePrefs(){
  if(!S.db){toast("Settings save inside claude.ai only.");return}

  const raw={};SUBS.forEach(k=>raw[k]=+val("w-"+k).value||0);const tot=SUBS.reduce((a,k)=>a+raw[k],0)||1;
  const weights={};SUBS.forEach(k=>weights[k]=Math.round(raw[k]*100/tot));
  const clamp=(x,a,b,d)=>{x=Math.round(+x);return isFinite(x)?Math.min(b,Math.max(a,x)):d};
  const body={regions,tiers:tiers.length?tiers:TIERS,other_regions:val("other").checked,exclude_people_mgmt:val("xpm").checked,
    include_no_pay:val("nopay").checked,digest_size:clamp(val("dsize").value,1,100,20),later_days:clamp(val("ldays").value,1,60,7),max_age_days:clamp(val("maxage").value,0,365,0),weights,updated_at:new Date().toISOString()};

  if(k==="j"||k==="k"){S.sel=Math.max(0,Math.min(list.length-1,S.sel+(k==="j"?1:-1)));render();document.querySelector(".card.sel")?.scrollIntoView({block:"nearest"});e.preventDefault()}
  else if(k==="enter"){S.open=list[S.sel].id;render()}
  else if(k==="i"||k==="l"||k==="n"){triage(list[S.sel],{i:"interested",l:"later",n:"not"}[k])}
});
document.addEventListener("paste",e=>{
  if(e.target.closest("input,textarea")) return;
  const txt=(e.clipboardData||window.clipboardData)?.getData("text");if(!txt) return;
  setView("add");setTimeout(()=>{const b=document.getElementById("paste");if(b){b.value=txt;b.focus()}},0);
});
boot();
</script>
